<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  <div style="position: absolute; top: -2px; right: -2px; width: 924px; height: 1084px; clip-path: polygon(100% 0, 20% 0, 4% 100%, 100% 100%); background: linear-gradient(200deg, #e8b94a, #c8902f); box-shadow: -30px 0 60px rgba(0,0,0,0.45);"></div>
  <div style="position: absolute; top: -2px; right: -2px; width: 910px; height: 1084px; clip-path: polygon(100% 0, 20% 0, 4% 100%, 100% 100%); background: #0d1d34;"></div>
  <div style="position: absolute; top: 0; right: 0; width: 890px; height: 1080px; clip-path: polygon(100% 0, 20% 0, 4% 100%, 100% 100%); overflow: hidden;">
    <div style="position: absolute; inset: 0; background: radial-gradient(72% 56% at 54% 46%, #2c5489 0%, #163457 38%, #08121f 100%);"></div>

    <img src="uploads/spicy-shrimp-wrap.webp" alt="Spicy Southwest Shrimp Wrap" style="position: absolute; inset: -10%; width: 120%; height: 120%; object-fit: contain; object-position: 56% 50%;">
    <div style="position: absolute; inset: 0; background: linear-gradient(105deg, rgba(8,18,31,0.55) 0%, rgba(8,18,31,0.06) 10%, transparent 24%);"></div>

  </div>

  <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="position: absolute; top: 60px; right: 780px; height: 260px; width: auto; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.65));">
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(90deg, #e8b94a, #c8902f 60%, transparent);"></div>

  <div style="position: absolute; left: 118px; top: 0; width: 1010px; height: 1080px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left;">
    <div style="display: flex; align-items: center; gap: 14px; justify-content: flex-start;">
      <span style="display: inline-flex; align-items: center; gap: 9px; background: linear-gradient(160deg, #ff4a24 0%, #d31408 55%, #9c0a04 100%); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 4px; padding: 9px 24px 7px; white-space: nowrap; flex-shrink: 0; clip-path: polygon(0 0, 97% 0, 100% 100%, 3% 100%); box-shadow: 0 4px 22px rgba(227,30,8,0.65);"><svg width="20" height="26" viewBox="0 0 32 42" style="display:block;margin-top:-2px;animation:lz-flick 1.4s ease-in-out infinite;"><path d="M17 0c1 8 10 11 10 22a11 11 0 1 1-22 0c0-4 2-7 4-9-1 5 2 7 4 7-4-5 0-14 4-20z" fill="#ffd24a"></path><path d="M17 14c.5 5 5 6 5 11a5 5 0 1 1-10 0c0-3 2-5 3-6 0 2 1 3 2 3-2-3 0-6 0-8z" fill="#ff7a1a"></path></svg>SPICY</span>
      <span style="display: inline-flex; align-items: center; background: linear-gradient(160deg, #1e3f78, #0d1d34); color: #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 6px; padding: 9px 28px 7px; white-space: nowrap; flex-shrink: 0; clip-path: polygon(0 0, 97% 0, 100% 100%, 3% 100%);">SIGNATURE WRAPZ</span>

      <span style="display: block; font-size: 200px; color: #0d1d34; text-shadow: 0 4px 0 rgba(0,0,0,0.15); white-space: nowrap;">SHRIMP</span>

    <p style="margin-top: 26px; max-width: 820px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 500; font-size: 32px; line-height: 1.3; color: #0d1d34; text-wrap: pretty;">Blackened shrimp, ghost pepper cheese, lettuce, pico de gallo and black bean &amp; corn salsa with roasted jalapeño ranch, wrapped and pressed in a flour tortilla.</p>

  <div style="position: absolute; left: 0; bottom: 0; width: 100%; height: 96px; background: linear-gradient(90deg, rgba(18,10,2,0.75) 0%, #120a02 18%, #120a02 82%, rgba(18,10,2,0)); display: flex; align-items: center; justify-content: center;">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 44px; letter-spacing: 5px; text-transform: uppercase; color: #ffffff;">WWW.LOCALZSPORTSBAR.COM</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}}">

class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('lz-stage');
      if (!el) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
  }
}

</script>
</body>
