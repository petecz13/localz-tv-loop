<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #050810; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  a { color: #f5a623; }
  a:hover { color: #ffd166; }
  @keyframes hr-glow { 0%,100% { text-shadow: 0 0 18px rgba(245,166,35,0.55), 0 14px 30px rgba(0,0,0,0.6); } 50% { text-shadow: 0 0 34px rgba(245,166,35,0.9), 0 14px 30px rgba(0,0,0,0.6); } }
  @keyframes hr-pop { 0%,100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(-2deg) scale(1.035); } }
  @keyframes hr-drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-22px,16px); } }
</style>
</helmet>

<div id="hr-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(130% 110% at 20% 0%, #14224a 0%, #0b1226 55%, #070c1a 100%); font-family: 'Barlow Semi Condensed', sans-serif; transform-origin: center center;">

  <div style="position: absolute; top: -180px; right: -120px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(245,166,35,0.22), transparent 70%); filter: blur(12px); animation: hr-drift 11s ease-in-out infinite;"></div>
  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(120deg, transparent 0 22px, rgba(255,255,255,0.028) 22px 24px); pointer-events: none;"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 10px; background: linear-gradient(90deg, #b8860b, #f5a623, #ffd166, #b8860b);"></div>

  <div style="position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; height: 990px; padding: 54px 96px 0 96px; gap: 70px; align-items: start;">

    <div style="display: flex; flex-direction: column; align-items: flex-start;">
      <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="height: 208px; width: auto; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6)); margin-left: -8px;">

      <h1 style="margin-top: 26px; font-family: 'Anton', sans-serif; font-weight: 400; line-height: 0.82; text-transform: uppercase; letter-spacing: -1px;">
        <span style="display: block; font-size: 148px; color: #f4f7ff; text-shadow: 0 14px 30px rgba(0,0,0,0.55);">WE&#39;RE</span>
        <span style="display: block; font-size: 176px; color: #f5a623; animation: hr-glow 3.4s ease-in-out infinite;">HIRING!</span>
      </h1>

      <div style="margin-top: 30px; padding: 14px 44px; background: #b9cee4; border-radius: 6px; transform: rotate(-2deg); animation: hr-pop 3.8s ease-in-out infinite; box-shadow: 0 14px 30px rgba(0,0,0,0.45);">
        <span style="font-family: 'Anton', sans-serif; font-size: 58px; letter-spacing: 3px; color: #0b1226;">HOST / HOSTESS</span>
      </div>

      <p style="margin-top: 26px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.12; letter-spacing: 1.5px; text-transform: uppercase; color: #f5a623;">Expo &amp; food runner<br>experience is a plus</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 34px; margin-top: 78px;">

      <div style="display: flex; align-items: center; gap: 34px; padding-bottom: 30px; border-bottom: 5px solid rgba(245,166,35,0.55);">
        <div style="flex-shrink: 0; width: 96px; height: 96px; border-radius: 50%; border: 6px solid #f5a623; display: flex; align-items: center; justify-content: center;">
          <span style="font-family: 'Anton', sans-serif; font-size: 56px; color: #f5a623;">$</span>
        </div>
        <div>
          <div style="font-family: 'Anton', sans-serif; font-size: 66px; line-height: 1; color: #f4f7ff; letter-spacing: 1px;">$15 / HR</div>
          <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 4px; text-transform: uppercase; color: #b9cee4; margin-top: 4px;">Plus tips</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 34px; padding-bottom: 30px; border-bottom: 5px solid rgba(245,166,35,0.55);">
        <div style="flex-shrink: 0; width: 96px; height: 96px; border-radius: 14px; border: 6px solid #f5a623; display: flex; flex-direction: column; overflow: hidden;">
          <div style="height: 22px; background: #f5a623;"></div>
          <div style="flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 5px; padding: 7px;">
            <span style="background: #f5a623;"></span><span style="background: #f5a623;"></span><span style="background: #f5a623;"></span>
            <span style="background: #f5a623;"></span><span style="background: #f5a623;"></span><span style="background: #f5a623;"></span>
          </div>
        </div>
        <div style="font-family: 'Anton', sans-serif; font-size: 58px; line-height: 1.02; color: #f4f7ff; letter-spacing: 1px;">FLEXIBLE<br>SCHEDULES</div>
      </div>

      <div style="display: flex; align-items: center; gap: 34px; padding-bottom: 30px; border-bottom: 5px solid rgba(245,166,35,0.55);">
        <div style="flex-shrink: 0; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" style="width: 84px; height: 84px;" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="#f5a623"></path></svg>
        </div>
        <div style="font-family: 'Anton', sans-serif; font-size: 58px; line-height: 1.02; color: #f4f7ff; letter-spacing: 1px;">FUN, HIGH-ENERGY<br>ENVIRONMENT</div>
      </div>

      <div style="display: flex; align-items: center; gap: 34px;">
        <div style="flex-shrink: 0; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" style="width: 84px; height: 84px;" aria-hidden="true"><path d="M12 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-6.5 1a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm13 0a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM12 10c-2.7 0-5 1.6-5 3.6V17h10v-3.4c0-2-2.3-3.6-5-3.6zM4.5 11C2.6 11 1 12.2 1 13.7V17h5v-3.4c0-.9.3-1.7.9-2.4-.4-.1-.9-.2-1.4-.2zm15 0c-.5 0-1 .1-1.4.2.6.7.9 1.5.9 2.4V17h5v-3.3c0-1.5-1.6-2.7-3.5-2.7z" fill="#f5a623"></path></svg>
        </div>
        <div style="font-family: 'Anton', sans-serif; font-size: 58px; line-height: 1.02; color: #f4f7ff; letter-spacing: 1px;">SERVER TRAINING<br>PROGRAM</div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: 152px; display: flex; align-items: center; justify-content: center; gap: 34px; background: linear-gradient(90deg, #d8901a, #f5a623 45%, #ffc95c 70%, #d8901a); border-top: 3px solid rgba(255,255,255,0.25);">
    <div style="width: 92px; height: 92px; border-radius: 50%; background: #0b1226; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" style="width: 52px; height: 52px;" aria-hidden="true"><path d="M7 2l11 8.5-5 .8 3.2 6.2-2.7 1.4L10.3 12.6 7 16V2z" fill="#f4f7ff"></path></svg>
    </div>
    <div style="font-family: 'Anton', sans-serif; color: #10192f; text-transform: uppercase;">
      <div style="font-size: 38px; letter-spacing: 3px; line-height: 1.1;">Apply online at</div>
      <div style="font-size: 56px; letter-spacing: 2px; line-height: 1.05;">LOCALZSPORTSBAR.COM/EMPLOYMENT</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('hr-stage');
      if (!el) { requestAnimationFrame(fit); return; }
      const w = window.innerWidth || document.documentElement.clientWidth;
      const h = window.innerHeight || document.documentElement.clientHeight;
      const s = Math.min(w / 1920, h / 1080);
      if (!s || !isFinite(s)) { requestAnimationFrame(fit); return; }
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  }
  renderVals() { return {}; }
}

</script>
</body>
</html>
