<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Localz + Clearwater Beach Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; width: 100%; height: 100%; overflow: hidden; }
  #tv { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px; overflow: hidden;
    background: #07152b; color: #fff; transform-origin: center center; font-family: 'Barlow Condensed', sans-serif; }

  /* grid: each venue column is 760px wide, centered on x=480 and x=1440 */
  .col { position: absolute; top: 0; width: 760px; height: 970px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .col.l { left: 100px; }
  .col.r { right: 100px; }
  .logo { height: 380px; margin-top: 136px; display: flex; align-items: center; justify-content: center; }
  .kicker { margin-top: 58px; font-weight: 600; font-size: 28px; letter-spacing: 8px; text-transform: uppercase; }
  .city { margin-top: 6px; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 96px; line-height: 1; letter-spacing: 1px; text-transform: uppercase; }
  .addr { margin-top: 14px; font-weight: 500; font-size: 30px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.72); }
  .rule { margin-top: 34px; width: 120px; height: 4px; border-radius: 2px; }
  .feat { margin-top: 30px; display: flex; align-items: center; gap: 22px; font-weight: 700; font-size: 34px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
  .feat i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes shimmer { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
</style>
</head>
<body>
<div id="tv">

  <!-- LEFT field: Localz, the bar at night -->
  <div style="position: absolute; inset: 0; clip-path: polygon(0 0, 1020px 0, 900px 970px, 0 970px);">
    <img src="uploads/IMG_4203.webp" alt="" style="position: absolute; left: 0; top: 0; width: 1020px; height: 970px; object-fit: cover; object-position: 50% 35%; filter: saturate(0.7) blur(2px); transform: scale(1.03);">
    <div style="position: absolute; inset: 0; background:
      radial-gradient(60% 55% at 25% 38%, rgba(242,175,50,0.16), transparent 70%),
      linear-gradient(180deg, rgba(7,21,43,0.86) 0%, rgba(12,35,64,0.88) 50%, rgba(7,21,43,0.97) 100%);"></div>
  </div>

  <!-- RIGHT field: Beach Bar, Gulf daylight -->
  <div style="position: absolute; inset: 0; clip-path: polygon(1020px 0, 1920px 0, 1920px 970px, 900px 970px);
    background:
      radial-gradient(55% 50% at 78% 30%, rgba(143,211,244,0.30), transparent 70%),
      linear-gradient(180deg, #24507f 0%, #1A3357 58%, #10223d 100%);">
    <!-- two quiet swells, not a pattern -->
    <svg viewBox="0 0 1920 200" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0; width: 1920px; height: 200px; animation: shimmer 7s ease-in-out infinite;">
      <path d="M900 120 C 1160 70, 1360 170, 1620 110 S 1880 90, 1920 100" fill="none" stroke="rgba(143,211,244,0.35)" stroke-width="3"/>
      <path d="M900 160 C 1180 115, 1400 205, 1660 150 S 1890 135, 1920 140" fill="none" stroke="rgba(143,211,244,0.20)" stroke-width="3"/>
    </svg>
  </div>

  <!-- divider: one clean line, gold into red -->
  <svg viewBox="0 0 1920 970" style="position: absolute; left: 0; top: 0; width: 1920px; height: 970px;">
    <defs><linearGradient id="seam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2AF32"/><stop offset="1" stop-color="#C12231"/></linearGradient></defs>
    <line x1="1020" y1="0" x2="900" y2="970" stroke="url(#seam)" stroke-width="6"/>
  </svg>

  <!-- center medallion on the divider (y=480 → x≈961) -->
  <div style="position: absolute; left: 961px; top: 480px; transform: translate(-50%, -50%); width: 128px; height: 128px; border-radius: 50%;
    background: #07152b; border: 5px solid #fff; box-shadow: 0 0 0 6px rgba(7,21,43,0.85), 0 14px 34px rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;">
    <span style="font-family: 'Anton', sans-serif; font-size: 70px; line-height: 1; color: #fff;">&amp;</span>
  </div>

  <!-- LOCALZ -->
  <div class="col l">
    <div class="logo"><img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="height: 330px; width: auto; filter: drop-shadow(0 20px 34px rgba(0,0,0,0.55)); animation: float 6s ease-in-out infinite;"></div>
    <div class="kicker" style="color: #F2AF32;">Sports Bar &amp; Grill</div>
    <div class="city">Downtown St.&nbsp;Pete</div>
    <div class="addr">1 Beach Drive SE</div>
    <div class="rule" style="background: #F2AF32;"></div>
    <div class="feat">60+ TVs <i style="background:#F2AF32"></i> Full Kitchen <i style="background:#F2AF32"></i> Pool Tables</div>
  </div>

  <!-- BEACH BAR -->
  <div class="col r">
    <div class="logo">
      <img src="uploads/cbb-logo-hd.webp" alt="Clearwater Beach Bar" style="width: 340px; height: 340px; border-radius: 50%; box-shadow: 0 0 0 5px #fff, 0 0 0 10px #C12231, 0 20px 40px rgba(0,0,0,0.5); animation: float 6s ease-in-out infinite; animation-delay: -3s;">
    </div>
    <div class="kicker" style="color: #ff9aa3;">Beach Bar &#8226; Now Open</div>
    <div class="city">Clearwater Beach</div>
    <div class="addr">411 Mandalay Ave</div>
    <div class="rule" style="background: #C12231;"></div>
    <div class="feat">Open Til 3AM <i style="background:#C12231"></i> DJ Fri &amp; Sat <i style="background:#C12231"></i> Sunday Ticket</div>
  </div>

  <!-- footer -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 72px; background: #050f20; border-top: 4px solid; border-image: linear-gradient(90deg, #F2AF32 0%, #F2AF32 47%, #C12231 53%, #C12231 100%) 1;">
    <span style="font-weight: 700; font-size: 28px; letter-spacing: 4px; color: rgba(255,255,255,0.8);">LOCALZSPORTSBAR.COM</span>
    <span style="font-family: 'Anton', sans-serif; font-size: 44px; letter-spacing: 3px; text-transform: uppercase;">Two Spots. <span style="color: #F2AF32;">One</span> <span style="color: #ff6b77;">Crew.</span></span>
    <span style="justify-self: end; font-weight: 700; font-size: 28px; letter-spacing: 3px; color: rgba(255,255,255,0.8);">@CLEARWATERBEACHBARUSA</span>
  </div>
</div>
<script>
  function fit(){ var s=Math.min(innerWidth/1920, innerHeight/1080); document.getElementById('tv').style.transform='scale('+s+')'; }
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
