<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0b0b0b; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  a { color: #f4c64a; }
  a:hover { color: #ffd77a; }
  @keyframes tt-float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-18px) rotate(-3deg); } }
  @keyframes tt-breathe { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  @keyframes tt-flick { 0%,16%,18%,40%,42%,100% { opacity: 1; } 17%,41%,70% { opacity: .6; } }
  @keyframes tt-badgepulse { 0%,100% { transform: rotate(-9deg) scale(1); } 50% { transform: rotate(-9deg) scale(1.05); } }
</style>
</helmet>

<div id="tt-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(130% 120% at 68% 42%, #16274a 0%, #0c1631 50%, #050a18 100%); font-family: 'Barlow Condensed', sans-serif; transform-origin: center center;">

  <!-- gold frame -->
  <div style="position: absolute; inset: 0; border: 30px solid #c8971f; box-shadow: inset 0 0 30px rgba(0,0,0,0.35); pointer-events: none; z-index: 6;"></div>

  <!-- ambient glows + grid + vignette -->
  <div style="position: absolute; left: 70%; top: 44%; width: 1250px; height: 1250px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(245,190,70,0.22), rgba(245,190,70,0.05) 54%, transparent 74%); pointer-events: none; animation: tt-breathe 6s ease-in-out infinite;"></div>
  <div style="position: absolute; left: 18%; top: 34%; width: 950px; height: 950px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(56,140,255,0.14), rgba(56,140,255,0.04) 56%, transparent 74%); pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(120,140,180,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(120,140,180,0.04) 1px, transparent 1px); background-size: 64px 64px; pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(125% 110% at 55% 46%, transparent 46%, rgba(0,0,0,0.66) 100%); pointer-events: none;"></div>
  <div style="position: absolute; top: 0; left: 0; width: 62%; height: 3px; background: linear-gradient(90deg, #5a9bff, rgba(56,140,255,0) 100%); box-shadow: 0 0 14px rgba(56,140,255,0.8);"></div>

  <!-- ================= LEFT CONTENT ================= -->
  <div style="position: absolute; left: 96px; top: 92px; width: 1000px; display: flex; flex-direction: column;">

    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar & Grill" style="height: 148px; width: auto; object-fit: contain; object-position: left center; filter: drop-shadow(0 0 22px rgba(255,170,55,0.35));">

    <!-- eyebrow -->
    <div style="display: flex; align-items: center; gap: 18px; margin-top: 22px;">
      <span style="display: inline-flex; align-items: center; border: 2px solid rgba(255,205,90,0.9); background: rgba(245,185,55,0.07); color: #ffe9b8; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 7px; padding: 9px 28px; white-space: nowrap; flex: 0 0 auto; border-radius: 999px; text-shadow: 0 0 8px rgba(255,200,80,0.9); box-shadow: 0 0 14px rgba(240,176,40,0.5), inset 0 0 12px rgba(240,176,40,0.18); animation: tt-flick 6s linear infinite;">{{ eyebrow }}</span>
      <span style="height: 2px; flex: 1; max-width: 260px; background: linear-gradient(90deg, rgba(255,205,90,0.9), transparent); box-shadow: 0 0 8px rgba(240,176,40,0.6);"></span>
    </div>

    <!-- hero title -->
    <div style="position: relative; margin-top: 10px;">
      <span style="display: block; font-family: 'Anton', sans-serif; font-size: 220px; line-height: 0.8; letter-spacing: 1px; text-transform: uppercase; color: #fff4d6; text-shadow: 0 0 8px #ffe199, 0 0 22px #ffc24a, 0 0 52px #f5a623, 0 0 100px #e08600;">TACO</span>
      <span style="display: block; margin-top: 2px; font-family: 'Kaushan Script', cursive; font-size: 132px; line-height: 0.9; color: #e8f1ff; text-shadow: 0 0 7px #b8d4ff, 0 0 20px #5a9bff, 0 0 46px #2f6fff, 0 0 90px #0b46d6;">Tuesdays</span>
    </div>

    <!-- feature spacer -->
    <div style="height: 30px;"></div>

    <!-- drink deal tile -->
    <div style="display: flex; margin-top: 40px; margin-left: 44px;">
      <div style="flex: 0 0 auto; border-radius: 22px; padding: 4px; background: linear-gradient(160deg, #ffe08a, #c8971f); box-shadow: 0 16px 36px rgba(0,0,0,0.55);">
        <div style="border-radius: 18px; background: radial-gradient(circle at 50% 30%, #f6da78, #d8a52a 84%); padding: 26px 50px; display: flex; align-items: center; gap: 24px;">
          <span style="font-family: 'Anton', sans-serif; font-size: 116px; line-height: 0.9; color: #000; text-shadow: 0 2px 0 rgba(255,255,255,0.35);">{{ deal2Price }}</span>
          <span style="display: flex; flex-direction: column; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 46px; letter-spacing: 2px; text-transform: uppercase; color: #000; line-height: 1.02;"><span>Los Sundays</span><span>Margarita</span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modelo $4 (middle) -->
  <div style="position: absolute; left: 500px; top: 90px; width: 480px; height: 700px; z-index: 4;">
    <div style="position: absolute; left: 120px; top: 70px; width: 480px; height: 620px;">
      <img src="uploads/modelo.webp" alt="Modelo" style="width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 22px 34px rgba(0,0,0,0.6));">
    </div>
    <div style="position: absolute; left: 272px; top: 40px; width: 176px; height: 176px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #f6da78, #c8971f 78%); box-shadow: 0 12px 26px rgba(0,0,0,0.55), inset 0 0 0 6px rgba(255,255,255,0.28); display: flex; align-items: center; justify-content: center; animation: tt-badgepulse 3.6s ease-in-out infinite;">
      <span style="font-family: 'Anton', sans-serif; font-size: 96px; line-height: 1; color: #000; text-shadow: 0 2px 0 rgba(255,255,255,0.3);">$4</span>
    </div>
  </div>

  <!-- ================= TACO BASKET (right) ================= -->
  <div style="position: absolute; right: 40px; top: 140px; width: 900px; height: 900px;">
    <img src="uploads/b7023890-b0ec-4aaa-9d82-d10abb98bc55.webp" alt="Bacon Chicken Ranch Tacos" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 30px 44px rgba(0,0,0,0.6));">
  </div>

  <!-- taco name badge (under tray) -->
  <div style="position: absolute; right: 40px; top: 942px; width: 900px; display: flex; justify-content: center; z-index: 5;">
    <div style="border-radius: 16px; padding: 4px; background: linear-gradient(160deg, #f0cb4e, #c8971f); box-shadow: 0 12px 30px rgba(0,0,0,0.5);">
      <div style="border-radius: 13px; background: radial-gradient(circle at 50% 30%, #f6da78, #d8a52a 84%); padding: 14px 40px;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 42px; letter-spacing: 2px; text-transform: uppercase; color: #000; text-shadow: 0 2px 0 rgba(255,255,255,0.25);">Bacon Chicken Ranch Tacos</span>
      </div>
    </div>
  </div>

  <!-- comes-with starburst badge -->
  <div style="position: absolute; right: 96px; top: 96px; width: 300px; height: 300px; animation: tt-badgepulse 3.6s ease-in-out infinite;">
    <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #d4141d 0%, #9c0d13 72%); box-shadow: 0 12px 30px rgba(0,0,0,0.55), 0 0 0 7px rgba(232,185,58,0.92);"></div>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px;">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 2px; text-transform: uppercase; color: #ffd257; line-height: 1;">Comes With</span>
      <span style="font-family: 'Anton', sans-serif; font-size: 50px; line-height: 0.98; color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); margin-top: 8px;">CHIPS &amp;<br>PICO</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 2px; text-transform: uppercase; color: #ffe4a3; line-height: 1; margin-top: 6px;">or Queso!</span>
    </div>
  </div>

  <!-- web footer -->
  <div style="position: absolute; left: 96px; bottom: 40px; display: flex; align-items: center; gap: 18px; z-index: 5;">
    <span style="width: 14px; height: 14px; transform: rotate(45deg); background: #ffc24a; box-shadow: 0 0 12px rgba(240,176,40,0.95); flex: 0 0 auto;"></span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: 5px; text-transform: uppercase; color: #f4e6bf; text-shadow: 0 0 9px rgba(255,200,80,0.5);">WWW.LOCALZSPORTSBAR.COM</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;EVERY TUESDAY&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;deal1Price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$4&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Drink Deals&quot;},&quot;deal1Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bottle&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Drink Deals&quot;},&quot;deal2Price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$6&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Drink Deals&quot;},&quot;deal2Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Los Sundays Margarita&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Drink Deals&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('tt-stage');
      if (!el) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
  }
  renderVals() {
    const p = this.props || {};
    return {
      eyebrow: p.eyebrow ?? "EVERY TUESDAY",
      deal1Price: p.deal1Price ?? "$4",
      deal1Label: p.deal1Label ?? "Bottle",
      deal2Price: p.deal2Price ?? "$6",
      deal2Label: p.deal2Label ?? "Los Sundays Margarita"
    };
  }
}
</script>
</body>
</html>
