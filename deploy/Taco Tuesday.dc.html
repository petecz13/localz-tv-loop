<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #06101f; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  @keyframes tt-bob { 0%,100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(-6deg) translateY(-10px); } }
  @keyframes tt-tilt { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(4deg); } }
</style>
</helmet>

<div id="tt-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(80% 85% at 74% 45%, #173a6e 0%, #0b1f40 55%, #050d1c 100%); font-family: 'Barlow Semi Condensed', sans-serif; transform-origin: center center;">

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(120deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px); pointer-events: none;"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 10px; background: #F2AF32;"></div>
  <!-- warm spotlight behind the food -->
  <div style="position: absolute; top: 120px; left: 900px; width: 1000px; height: 780px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,175,50,0.30), transparent);"></div>

  <!-- left: copy -->
  <div style="position: absolute; top: 90px; left: 96px; width: 820px;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="width: 70px; height: 4px; background: #F2AF32;"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 10px; text-transform: uppercase; color: #9fc3ee;">Every Tuesday</span>
    </div>
    <div style="margin-top: 14px; font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: 0.9;">
      <div style="font-size: 200px; color: #ffffff; letter-spacing: 2px;">TACO</div>
      <div style="font-size: 200px; color: #F2AF32; letter-spacing: 2px; text-shadow: 0 0 30px rgba(242,175,50,0.6), 0 8px 0 #071528;">TUESDAY</div>
    </div>

    <!-- taco price -->
    <div style="margin-top: 36px; display: flex; align-items: center; gap: 26px;">
      <div style="padding: 10px 34px 14px; border-radius: 16px; background: #F2AF32; box-shadow: 0 14px 30px rgba(0,0,0,0.4);">
        <span style="font-family: 'Anton', sans-serif; font-size: 120px; line-height: 1; color: #0C2340;">$13</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Anton', sans-serif; font-size: 50px; line-height: 1.02; letter-spacing: 2px; text-transform: uppercase; color: #ffffff;">Bacon Chicken<br>Ranch Tacos</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 2px; text-transform: uppercase; color: #9fc3ee;">With Chips &amp; Pico <span style="color: #F2AF32;">or Queso</span></span>
      </div>
    </div>

    <!-- drink deals -->
    <div style="margin-top: 40px; display: flex; gap: 20px;">
      <div style="display: flex; align-items: center; gap: 18px; padding: 14px 28px; border-radius: 14px; background: rgba(12,35,64,0.85); border: 3px solid #F2AF32;">
        <span style="font-family: 'Anton', sans-serif; font-size: 64px; line-height: 1; color: #F2AF32;">$4</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: 2px; text-transform: uppercase; color: #ffffff;">Modelo<br>Bottles</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px; padding: 14px 28px; border-radius: 14px; background: rgba(12,35,64,0.85); border: 3px solid #F2AF32;">
        <span style="font-family: 'Anton', sans-serif; font-size: 64px; line-height: 1; color: #F2AF32;">$6</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: 2px; text-transform: uppercase; color: #ffffff;">Los Sundays<br>Margaritas</span>
      </div>
    </div>
  </div>

  <!-- right: food + bottle -->
  <img src="uploads/tacos-tray.webp" alt="Bacon Chicken Ranch Tacos" style="position: absolute; left: 880px; top: 270px; width: 820px; height: auto; transform: rotate(-6deg); filter: drop-shadow(0 40px 40px rgba(0,0,0,0.6)); animation: tt-bob 6s ease-in-out infinite;">
  <img src="uploads/modelo-bottle.webp" alt="Modelo bottle" style="position: absolute; left: 1650px; top: 150px; height: 560px; width: auto; transform-origin: bottom center; filter: drop-shadow(0 26px 30px rgba(0,0,0,0.55)); animation: tt-tilt 5s ease-in-out infinite;">

  <!-- footer -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; display: flex; align-items: center; gap: 30px; padding: 0 70px; background: #0C2340; border-top: 4px solid #F2AF32;">
    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="height: 92px; width: auto; object-fit: contain;">
    <span style="font-family: 'Anton', sans-serif; font-size: 40px; letter-spacing: 4px; text-transform: uppercase; color: #F2AF32;">Tacos &#8226; Cervezas &#8226; Margs</span>
    <span style="margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 5px; text-transform: uppercase; color: #9fb6d6;">WWW.LOCALZSPORTSBAR.COM</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('tt-stage');
      if (!el) { requestAnimationFrame(fit); return; }
      const w = window.innerWidth || document.documentElement.clientWidth;
      const h = window.innerHeight || document.documentElement.clientHeight;
      const s = Math.min(w / 1920, h / 1080);
      if (!s || !isFinite(s)) { requestAnimationFrame(fit); return; }
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
