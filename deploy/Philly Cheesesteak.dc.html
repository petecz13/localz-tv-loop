<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #04070e; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  a { color: #f4c64a; }
  a:hover { color: #ffd77a; }
  @keyframes lz-sheen { 0% { transform: translateX(-120%) skewX(-18deg); } 55%,100% { transform: translateX(340%) skewX(-18deg); } }
  @keyframes lz-glow { 0%,100% { opacity: 1; } 50% { opacity: .78; } }
  @keyframes lz-flick { 0%,16%,18%,100% { opacity: 1; } 17%,60% { opacity: .62; } }
</style>
</helmet>

<div id="lz-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(125% 115% at 50% 30%, #e8c25c 0%, #d2a028 44%, #a87c24 100%); font-family: 'Barlow Semi Condensed', sans-serif; transform-origin: center center;">

  <!-- scoreboard weave texture -->
  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg, transparent 0 18px, rgba(255,255,255,0.035) 18px 20px); pointer-events: none;"></div>
  <!-- vignette -->
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 110% at 50% 42%, transparent 44%, rgba(90,58,12,0.55) 100%); pointer-events: none;"></div>

  <!-- ===== SCOREBOARD BOARD ===== -->
  <div style="position: absolute; inset: 38px; border-radius: 30px; padding: 3px; background: linear-gradient(160deg, rgba(244,198,74,0.9), rgba(180,132,40,0.35) 46%, rgba(244,198,74,0.75)); box-shadow: 0 0 34px rgba(240,190,70,0.28), 0 26px 60px rgba(0,0,0,0.6);">
    <div style="position: relative; width: 100%; height: 100%; border-radius: 27px; overflow: hidden; background: linear-gradient(180deg, #0c1a30 0%, #0a1526 52%, #070f1e 100%); display: flex; flex-direction: column; padding: 46px 54px 40px;">
      <div style="position: absolute; inset: 0; box-shadow: inset 0 0 90px 30px rgba(0,0,0,0.5); pointer-events: none; border-radius: 27px;"></div>

      <!-- ===== HEADER ===== -->
      <div style="display: flex; align-items: center; gap: 26px; position: relative; z-index: 2;">
        <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="height: 92px; width: auto; object-fit: contain; filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));">
        <!-- Celebrate 250 logo (top middle) -->
        <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #ffffff; border-radius: 14px; padding: 10px 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.45);">
          <img src="uploads/america-250.webp" alt="Celebrate 250" style="display: block; height: 80px; width: auto; object-fit: contain;">
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 20px;">
          <span style="height: 2px; width: 64px; background: linear-gradient(90deg, transparent, #f4c64a); box-shadow: 0 0 8px rgba(240,190,70,0.7);"></span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: 8px; text-transform: uppercase; color: #ffd257; text-shadow: 0 0 10px rgba(255,200,80,0.85), 0 0 26px rgba(240,176,40,0.5); animation: lz-glow 4.5s ease-in-out infinite; white-space: nowrap;">{{ eyebrow }}</span>
          <span style="height: 2px; width: 64px; background: linear-gradient(270deg, transparent, #f4c64a); box-shadow: 0 0 8px rgba(240,190,70,0.7);"></span>
        </div>
      </div>
      <!-- gold header rule -->
      <div style="margin-top: 26px; height: 2px; width: 100%; background: linear-gradient(90deg, rgba(244,198,74,0.15), rgba(244,198,74,0.85) 50%, rgba(244,198,74,0.15)); box-shadow: 0 0 10px rgba(240,190,70,0.45); position: relative; z-index: 2;"></div>

      <!-- ===== MAIN ===== -->
      <div style="flex: 1; display: flex; align-items: center; gap: 58px; position: relative; z-index: 2; padding-top: 30px;">

        <!-- photo circle -->
        <div style="width: 640px; height: 640px; flex-shrink: 0; border-radius: 50%; padding: 4px; background: linear-gradient(150deg, rgba(244,198,74,0.9), rgba(150,110,34,0.4) 50%, rgba(244,198,74,0.8)); box-shadow: 0 0 26px rgba(240,190,70,0.28), 0 18px 44px rgba(0,0,0,0.55);">
          <div style="position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: radial-gradient(70% 70% at 50% 42%, #e8c25c 0%, #d2a028 52%, #a87c24 100%);">
            <img src="uploads/philly cheesesteak.webp" alt="Philly Cheesesteak" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%;">
          </div>
        </div>

        <!-- text column -->
        <div style="flex: 1; display: flex; flex-direction: column; align-items: flex-start;">
          <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
            <span style="display: inline-flex; align-items: center; gap: 10px; padding: 7px 22px; border-radius: 999px; background: linear-gradient(160deg, #f4c64a, #cf9a32); color: #0c1a30; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 4px 14px rgba(0,0,0,0.4);">{{ size1 }} <span style="opacity:0.55;">/</span> {{ size2 }}</span>
          </div>
          <h1 style="margin-top: 22px; font-family: 'Anton', sans-serif; font-weight: 400; line-height: 0.82; text-transform: uppercase;">
            <span style="display: block; font-size: 72px; color: #f6efdd; text-shadow: 0 3px 0 rgba(0,0,0,0.35); white-space: nowrap;">{{ titleTop }}</span>
            <span style="display: block; font-size: 120px; color: #ffcf4a; text-shadow: 0 0 22px rgba(240,176,40,0.45), 0 4px 0 rgba(0,0,0,0.3); white-space: nowrap;">{{ titleBottom }}</span>
          </h1>
          <p style="margin-top: 26px; max-width: 720px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 500; font-size: 33px; line-height: 1.32; color: #d7e2f0; text-wrap: pretty;">{{ description }}</p>

          <!-- served-with-side tab -->
          <div style="margin-top: 32px; display: inline-flex; align-items: center; gap: 18px; border-radius: 14px; padding: 3px; background: linear-gradient(150deg, rgba(244,198,74,0.9), rgba(150,110,34,0.4) 50%, rgba(244,198,74,0.8)); box-shadow: 0 0 20px rgba(240,190,70,0.25), 0 12px 30px rgba(0,0,0,0.5);">
            <div style="border-radius: 11px; background: linear-gradient(160deg, #b3121b 0%, #8a0d13 60%, #6e0a0f 100%); padding: 16px 34px; display: flex; align-items: center; gap: 18px;">
              <span style="width: 14px; height: 14px; transform: rotate(45deg); background: #ffcf4a; box-shadow: 0 0 8px rgba(240,190,70,0.8); flex-shrink: 0;"></span>
              <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; white-space: nowrap;">{{ sideNote }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== FOOTER ===== -->
      <div style="position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 18px; padding-top: 26px;">
        <span style="height: 2px; flex: 1; background: linear-gradient(90deg, transparent, rgba(244,198,74,0.4));"></span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 32px; letter-spacing: 5px; text-transform: uppercase; color: #cfe0f2;">WWW.LOCALZSPORTSBAR.COM</span>
        <span style="height: 2px; flex: 1; background: linear-gradient(270deg, transparent, rgba(244,198,74,0.4));"></span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SIGNATURE PHILLY&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Header&quot;},&quot;celebrate250Src&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;uploads/america-250.webp&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Header&quot;},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;FAN FAVORITE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;titleTop&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PHILLY&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;titleBottom&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CHEESESTEAK&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;description&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Shaved ribeye, American cheese, sautéed onions & peppers and house queso on a toasted hoagie roll.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;highlightMain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$16&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Highlight Row&quot;},&quot;highlightAlt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Loaded&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Highlight Row&quot;},&quot;highlightSub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Add a side&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Highlight Row&quot;},&quot;size1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8\&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;size2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12\&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;sideNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Served with your choice of side&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('lz-stage');
      if (!el) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
  }
  renderVals() {
    const p = this.props || {};
    return {
      eyebrow: p.eyebrow ?? "SIGNATURE PHILLY",
      kicker: p.kicker ?? "FAN FAVORITE",
      titleTop: p.titleTop ?? "PHILLY",
      titleBottom: p.titleBottom ?? "CHEESESTEAK",
      description: p.description ?? "Shaved ribeye, American cheese, sautéed onions & peppers and house queso on a toasted hoagie roll.",
      highlightMain: p.highlightMain ?? "$16",
      highlightAlt: p.highlightAlt ?? "Loaded",
      highlightSub: p.highlightSub ?? "Add a side",
      size1: p.size1 ?? "8\"",
      size2: p.size2 ?? "12\"",
      sideNote: p.sideNote ?? "Served with your choice of side",
      celebrate250Src: p.celebrate250Src ?? "uploads/america-250.webp"
    };
  }
}
</script>
</body>
</html>
