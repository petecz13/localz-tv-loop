<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #6b4405; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  a { color: #e8b94a; }
  a:hover { color: #ffd24a; }
  @keyframes lz-sheen { 0% { transform: translateX(-120%) skewX(-18deg); } 55%,100% { transform: translateX(320%) skewX(-18deg); } }
  @keyframes lz-flick { 0%,100% { opacity: .9; } 50% { opacity: .55; } }
  @keyframes lz-drip { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
</style>
</helmet>

<div id="lz-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(120% 120% at 68% 36%, #e8b94a 0%, #c8902f 38%, #8a5a10 70%, #5c3a08 100%); font-family: 'Barlow Semi Condensed', sans-serif; transform-origin: center center;">

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(62deg, transparent 0 46px, rgba(13,29,52,0.07) 46px 48px); pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 100% at 70% 50%, transparent 45%, rgba(10,6,0,0.55) 100%); pointer-events: none;"></div>

  <div style="position: absolute; top: -2px; right: -2px; width: 924px; height: 1084px; clip-path: polygon(100% 0, 20% 0, 4% 100%, 100% 100%); background: linear-gradient(200deg, #e8b94a, #c8902f); box-shadow: -30px 0 60px rgba(0,0,0,0.45);"></div>
  <div style="position: absolute; top: -2px; right: -2px; width: 910px; height: 1084px; clip-path: polygon(100% 0, 20% 0, 4% 100%, 100% 100%); background: #0d1d34;"></div>
  <div style="position: absolute; top: 0; right: 0; width: 890px; height: 1080px; clip-path: polygon(100% 0, 20% 0, 4% 100%, 100% 100%); overflow: hidden;">
    <div style="position: absolute; inset: 0; background: radial-gradient(72% 56% at 54% 46%, #2c5489 0%, #163457 38%, #08121f 100%);"></div>
    <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg, transparent 0, transparent 18px, rgba(255,255,255,0.025) 18px, rgba(255,255,255,0.025) 20px);"></div>
    <img src="uploads/hot-honey-chicken.webp" alt="Hot Honey Chicken Sandwich" style="position: absolute; inset: 4%; width: 92%; height: 92%; object-fit: contain; object-position: 58% 50%; filter: drop-shadow(0 24px 48px rgba(0,0,0,0.5));">
    <div style="position: absolute; inset: 0; background: linear-gradient(105deg, rgba(8,18,31,0.55) 0%, rgba(8,18,31,0.06) 10%, transparent 24%);"></div>
    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 130px; background: linear-gradient(0deg, rgba(8,18,31,0.85) 0%, transparent 100%); pointer-events: none;"></div>
    <div style="position: absolute; top: -10%; left: 0; width: 36%; height: 120%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent); animation: lz-sheen 6.5s ease-in-out infinite;"></div>
  </div>

  <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="position: absolute; top: 60px; right: 780px; height: 260px; width: auto; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.65));">
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(90deg, #e8b94a, #c8902f 60%, transparent);"></div>

  <div style="position: absolute; left: 118px; top: 0; width: 1010px; height: 1080px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left;">
    <div style="display: flex; align-items: center; gap: 14px; justify-content: flex-start;">
      <span style="display: inline-flex; align-items: center; gap: 9px; background: linear-gradient(160deg, #ff9d1c 0%, #ef6c00 55%, #b34700 100%); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 4px; padding: 9px 24px 7px; white-space: nowrap; flex-shrink: 0; clip-path: polygon(0 0, 97% 0, 100% 100%, 3% 100%); box-shadow: 0 4px 22px rgba(239,108,0,0.6);"><svg width="24" height="24" viewBox="0 0 32 32" style="display:block;margin-top:-2px;animation:lz-drip 2.2s ease-in-out infinite;"><path d="M16 2c3 6 9 9 9 16a9 9 0 1 1-18 0c0-3 1.4-5.6 3.2-7.6C9.6 13.4 12 15 13 15c-2.4-3.6.6-9 3-13z" fill="#ffd24a"></path><path d="M16 13c1 3 4 4 4 8a4 4 0 1 1-8 0c0-2 1.4-3.4 2.4-4.4-.4 1.4.6 2.4 1.6 2.4-1.2-2 0-4 0-6z" fill="#ffb01a"></path></svg>SWEET HEAT</span>
      <span style="display: inline-flex; align-items: center; background: linear-gradient(160deg, #1e3f78, #0d1d34); color: #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 6px; padding: 9px 28px 7px; white-space: nowrap; flex-shrink: 0; clip-path: polygon(0 0, 97% 0, 100% 100%, 3% 100%);">{{ eyebrow }}</span>
      <span style="height: 3px; flex: 1; max-width: 180px; background: linear-gradient(270deg, transparent, #e8b94a);"></span>
    </div>
    <h1 style="margin-top: 22px; font-family: 'Anton', sans-serif; font-weight: 400; line-height: 0.84; letter-spacing: -1px; text-transform: uppercase;">
      <span style="display: block; font-size: 108px; color: #ffffff; text-shadow: 0 4px 0 rgba(0,0,0,0.20); white-space: nowrap;">{{ titleTop }}</span>
      <span style="display: block; font-size: 176px; color: #0d1d34; text-shadow: 0 4px 0 rgba(0,0,0,0.15); white-space: nowrap;">{{ titleBottom }}</span>
    </h1>
    <p style="margin-top: 26px; max-width: 820px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 500; font-size: 32px; line-height: 1.3; color: #0d1d34; text-wrap: pretty;">{{ description }}</p>
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 24px; justify-content: flex-start;">
      <span style="width: 16px; height: 16px; transform: rotate(45deg); background: #0d1d34; flex-shrink: 0; animation: lz-flick 2.6s ease-in-out infinite;"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff;">{{ tag }}</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 100%; height: 96px; background: linear-gradient(90deg, rgba(18,10,2,0.75) 0%, #120a02 18%, #120a02 82%, rgba(18,10,2,0)); display: flex; align-items: center; justify-content: center;">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 44px; letter-spacing: 5px; text-transform: uppercase; color: #ffffff;">WWW.LOCALZSPORTSBAR.COM</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SIGNATURE SANDWICHZ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleTop&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;HOT HONEY&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleBottom&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CHICKEN&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;description&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hand-breaded crispy chicken breast drizzled in hot honey, stacked with smoky bacon, melted cheddar and a fried egg on a toasted brioche bun.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Served with your choice of side&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('lz-stage');
      if (!el) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
  }
  renderVals() {
    const p = this.props || {};
    return {
      eyebrow: p.eyebrow ?? "SIGNATURE SANDWICHZ",
      titleTop: p.titleTop ?? "HOT HONEY",
      titleBottom: p.titleBottom ?? "CHICKEN",
      description: p.description ?? "Hand-breaded crispy chicken breast drizzled in hot honey, stacked with smoky bacon, melted cheddar and a fried egg on a toasted brioche bun.",
      tag: p.tag ?? "Served with your choice of side"
    };
  }
}
</script>
</body>
</html>
