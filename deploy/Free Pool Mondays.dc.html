<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #050810; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  a { color: #5ef2ff; }
  a:hover { color: #9df9ff; }
  @keyframes fp-drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(26px,-20px); } }
  @keyframes fp-drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-24px,18px); } }
  @keyframes fp-glow { 0%,100% { text-shadow: 0 0 18px rgba(255,209,102,0.85), 0 0 46px rgba(255,209,102,0.5); } 50% { text-shadow: 0 0 30px rgba(255,209,102,1), 0 0 70px rgba(255,209,102,0.75); } }
  @keyframes fp-pop { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.04) rotate(-4deg); } }
</style>
</helmet>

<div id="fp-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(120% 100% at 50% 0%, #1c2c56 0%, #101a34 60%); font-family: 'Barlow Semi Condensed', sans-serif; transform-origin: center center;">

  <div style="position: absolute; top: -150px; left: -110px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(94,242,255,0.5), transparent 70%); filter: blur(10px); animation: fp-drift1 9s ease-in-out infinite;"></div>
  <div style="position: absolute; bottom: -170px; right: -100px; width: 580px; height: 580px; border-radius: 50%; background: radial-gradient(circle, rgba(255,60,150,0.45), transparent 70%); filter: blur(10px); animation: fp-drift2 10s ease-in-out infinite;"></div>
  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(120deg, transparent 0 22px, rgba(255,255,255,0.03) 22px 24px); pointer-events: none;"></div>

  <div style="position: relative; z-index: 2; flex: 1; height: 780px; display: flex; align-items: center; justify-content: space-between; padding: 0 90px; gap: 40px;">

    <div style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; max-width: 900px; margin-top: 160px;">
      <h1 style="font-family: 'Anton', sans-serif; font-weight: 400; line-height: 0.86; text-transform: uppercase;">
        <span style="display: block; font-size: 100px; color: #f2f6ff;">FREE POOL</span>
        <span style="display: block; font-size: 132px; color: #ffd166; animation: fp-glow 3s ease-in-out infinite;">MONDAYS</span>
      </h1>

      <div style="margin-top: 40px; display: flex; align-items: center; gap: 28px;">
        <div style="position: relative; display: flex; align-items: baseline; gap: 14px; padding: 18px 40px; border-radius: 18px; background: linear-gradient(135deg, #1c3a5e, #0e1f38); border: 2px solid rgba(94,242,255,0.6); box-shadow: 0 0 30px rgba(94,242,255,0.35), 0 16px 32px rgba(0,0,0,0.5); transform: rotate(-4deg); animation: fp-pop 3.4s ease-in-out infinite;">
          <span style="font-family: 'Anton', sans-serif; font-size: 64px; color: #fff; line-height: 1;">ALL TABLES</span>
        </div>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 1px; color: #cfe0f2;">All Day</span>
      </div>

      <p style="margin-top: 34px; max-width: 760px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 500; font-size: 32px; line-height: 1.35; color: #b9c6da; text-wrap: pretty;">Rack &#39;em up &#8212; every table's on us all Monday night. Grab a cue, grab a drink, and settle the score.</p>

      <div style="margin-top: 36px; display: flex; align-items: center; gap: 22px;">
        <div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 28px; border-radius: 999px; background: rgba(255,209,102,0.12); border: 2px solid rgba(255,209,102,0.6);">
          <span style="font-family: 'Anton', sans-serif; font-size: 44px; color: #ffd166;">$10</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 1px; text-transform: uppercase; color: #ffe9b8;">Burgers All Monday</span>
        </div>
      </div>
      <div style="margin-top: 30px; display: flex; gap: 14px;">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #5ef2ff; box-shadow: 0 0 12px rgba(94,242,255,0.7);"></span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #ff3c96; box-shadow: 0 0 12px rgba(255,60,150,0.7);"></span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #ffd166; box-shadow: 0 0 12px rgba(255,209,102,0.7);"></span>
      </div>
    </div>

    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="flex-shrink: 0; height: 260px; width: auto; object-fit: contain; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55)); align-self: flex-start; margin-top: 40px;">

    <div style="flex-shrink: 0; width: 700px; height: 700px; display: flex; align-items: center; justify-content: center; margin-top: 60px;">
      <img src="uploads/IMG_4203.webp" alt="Pool tables at Localz" style="width: 100%; height: 100%; object-fit: cover; border-radius: 28px; box-shadow: 0 0 0 4px rgba(94,242,255,0.85), 0 0 60px rgba(94,242,255,0.35), 0 20px 60px rgba(0,0,0,0.6);">
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; height: 84px; display: flex; align-items: center; justify-content: center; background: linear-gradient(90deg, #b8860b, #ffd166, #b8860b); border-top: 2px solid rgba(255,209,102,0.7);">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 5px; text-transform: uppercase; color: #1c1400;">WWW.LOCALZSPORTSBAR.COM</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('fp-stage');
      if (!el) { requestAnimationFrame(fit); return; }
      const w = window.innerWidth || document.documentElement.clientWidth;
      const h = window.innerHeight || document.documentElement.clientHeight;
      const s = Math.min(w / 1920, h / 1080);
      if (!s || !isFinite(s)) { requestAnimationFrame(fit); return; }
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
