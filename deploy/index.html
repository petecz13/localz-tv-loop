  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Localz — New Slides Loop<\u002Ftitle>\n<style>\n  *{margin:0;padding:0;box-sizing:border-box;}\n  html,body{height:100%;background:#000;overflow:hidden;}\n  #stage{position:fixed;inset:0;background:#000;perspective:2200px;}\n  .slide{position:absolute;top:50%;left:50%;width:1920px;height:1080px;border:none;will-change:opacity,transform,filter,clip-path;backface-visibility:hidden;}\n  #hud{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;\n    pointer-events:none;opacity:0;transition:opacity .4s ease;}\n  #hud.on{opacity:1;}\n  #hud .bar{margin:0 0 22px;padding:11px 22px;border-radius:999px;display:flex;align-items:center;gap:18px;\n    background:rgba(8,16,28,.74);backdrop-filter:blur(8px);border:1px solid rgba(194,215,239,.18);\n    font-family:-apple-system,system-ui,sans-serif;color:#c2d7ef;font-size:15px;letter-spacing:.04em;\n    text-transform:uppercase;font-weight:600;white-space:nowrap;}\n  #hud kbd{display:inline-block;min-width:18px;text-align:center;padding:2px 7px;border-radius:5px;margin-right:6px;\n    background:rgba(211,161,41,.95);color:#0d233f;font-weight:800;font-size:13px;}\n  #hud .sep{width:1px;height:15px;background:rgba(194,215,239,.25);}\n  #hud .count{color:#f4c64a;font-weight:800;}\n  #paused{position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:50;\n    padding:8px 20px;border-radius:999px;background:rgba(211,161,41,.95);color:#0d233f;\n    font-family:-apple-system,system-ui,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:15px;\n    opacity:0;transition:opacity .3s ease;pointer-events:none;}\n  #paused.on{opacity:1;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"stage\"><\u002Fdiv>\n<div id=\"hud\">\n  <div class=\"bar\">\n    <span><kbd>◀<\u002Fkbd><kbd>▶<\u002Fkbd> Navigate<\u002Fspan>\n    <div class=\"sep\"><\u002Fdiv>\n    <span><kbd>P<\u002Fkbd> Pause<\u002Fspan>\n    <div class=\"sep\"><\u002Fdiv>\n    <span><kbd>F<\u002Fkbd> Fullscreen<\u002Fspan>\n    <div class=\"sep\"><\u002Fdiv>\n    <span class=\"count\" id=\"hud-count\">1 / 1<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div id=\"paused\">⏸ Paused<\u002Fdiv>\n\n<script>\n(function(){\n  var CONFIG = {\n    holdSec: 12,   // seconds per slide\n    fadeMs:  1000, // transition duration\n  };\n\n  var SLIDES_SRC = [\n    { src: 'Trivia%20Night.dc.html', label: 'Trivia Night' },\n    { src: 'Taco%20Tuesday.dc.html', label: 'Taco Tuesday' },\n    { src: 'Bacon%20Chicken%20Ranch%20Wrap.dc.html', label: 'Bacon Chicken Ranch Wrap' },\n    { src: 'Beach%20Drive%20Chicken%20Wrap.dc.html', label: 'Beach Drive Chicken Wrap' },\n    { src: 'Buffalo%20Garlic%20Parm%20Shrimp%20Wrap.dc.html', label: 'Buffalo Garlic Parm Shrimp Wrap' },\n    { src: 'Free%20Pool%20Mondays.dc.html', label: 'Free Pool Mondays' },\n    { src: 'Spicy%20Southwest%20Shrimp%20Wrap.dc.html', label: 'Spicy Southwest Shrimp Wrap' },\n    { src: 'Spicy%20Southwest%20Shrimp%20Salad.dc.html', label: 'Spicy Southwest Shrimp Salad' },\n    { src: 'House%20Avocado%20Caesar%20Salad.dc.html', label: 'House Avocado Caesar Salad' },\n    { src: 'Blackened%20Chicken%20Cobb%20Salad.dc.html', label: 'Blackened Chicken Cobb Salad' },\n    { src: 'Hot%20Honey%20Chicken.dc.html', label: 'Hot Honey Chicken' },\n    { src: 'Free%20Pool%20Mondays.dc.html', label: 'Free Pool Mondays' },\n    { src: 'Philly%20Fire%20Cheesesteak.dc.html', label: 'Philly Fire Steak' },\n    { src: 'Philly%20Cheesesteak.dc.html', label: 'Philly Cheesesteak' },\n    { src: 'Chicken%20Quesadilla.dc.html', label: 'Chicken Quesadilla' },\n    { src: 'Cheesesteak%20Hoagie%20Wrap.dc.html', label: 'Cheesesteak Hoagie Wrap' },\n    { src: 'Chicago%20Dog.dc.html', label: 'Chicago Dog' },\n    { src: 'Free%20Pool%20Mondays.dc.html', label: 'Free Pool Mondays' },\n    { src: 'South%20Philly%20Dog.dc.html', label: 'South Philly Dog' },\n    { src: 'DTSP%20Burger.dc.html', label: 'DTSP Burger' },\n    { src: 'Beach%20Drive%20Burger%20Neon.dc.html', label: 'Beach Drive Burger' },\n    { src: 'Buffalo%20Chicken%20Salad.html', label: 'Buffalo Chicken Salad' },\n    { src: 'Chicken%20Taco%20Salad.html', label: 'Chicken Taco Salad' },\n    { src: 'Free%20Pool%20Mondays.dc.html', label: 'Free Pool Mondays' },\n    { src: 'Roasted%20Beet%20Salad.html', label: 'Roasted Beet Salad' },\n    { src: 'Bacon%20Chicken%20Ranch%20Taco.dc.html', label: 'Bacon Chicken Ranch Taco' },\n    { src: 'Buffalo%20Garlic%20Parm%20Wingz%20Bone-In.dc.html', label: 'Buffalo Garlic Parm Wingz (Bone-In)' },\n    { src: 'Localz%20Dry%20Rub%20Wingz%20Bone-In.dc.html', label: 'Localz Dry Rub Wingz (Bone-In)' },\n    { src: 'Peach%20Mango%20Habanero%20Wingz%20Bone-In.dc.html', label: 'Peach Mango Habanero Wingz (Bone-In)' },\n    { src: 'Free%20Pool%20Mondays.dc.html', label: 'Free Pool Mondays' },\n    { src: 'Buffalo%20Garlic%20Parm%20Wingz%20Boneless.dc.html', label: 'Buffalo Garlic Parm Wingz (Boneless)' },\n    { src: 'Crispy%20Potato%20Skins.dc.html', label: 'Crispy Potato Skins' },\n    { src: 'Philly%20Tots.dc.html', label: 'Philly Cheesesteak Totz' },\n    { src: 'Double%20Bacon%20Philly.dc.html', label: 'Double Bacon Philly' },\n    { src: 'Avocado%20Caesar%20Chicken%20Wrap.dc.html', label: 'Avocado Caesar Chicken Wrap' },\n    { src: 'Free%20Pool%20Mondays.dc.html', label: 'Free Pool Mondays' },\n    { src: 'Pretzel%20Bites.dc.html', label: 'Soft Pretzel Bites' },\n    { src: 'Bacon%20Localz%20Totz.dc.html', label: 'Bacon Localz Totz' },\n    { src: 'Boneless%20Wingz.dc.html', label: 'Honey BBQ Boneless Wingz' },\n    { src: 'Fried%20Pickles.dc.html', label: 'Fried Pickles' },\n    { src: 'Lemon%20Pepper%20Goat%20Sproutz.dc.html', label: 'Lemon Pepper & Goat Sproutz' },\n    { src: 'Free%20Pool%20Mondays.dc.html', label: 'Free Pool Mondays' },\n    { src: 'Chicken%20Club.dc.html', label: 'Chicken Club' },\n    { src: 'Happy%20Hour.dc.html', label: 'Happy Hour' },\n    { src: 'Wing%20Thursday.dc.html', label: 'Wing Thursday' },\n    { src: 'Beach%20Bar%20Now%20Open.html', label: 'Beach Bar Now Open' },\n    { src: 'Bucs%20Game.dc.html', label: 'Bucs Game' },\n    { src: 'Free%20Pool%20Mondays.dc.html', label: 'Free Pool Mondays' },\n    { src: 'Superlyte%20Mondays.dc.html', label: 'Superlyte Mondays' },\n    { src: 'Now%20Hiring.dc.html', label: 'Now Hiring' },\n    { src: 'October%20Calendar.dc.html', label: 'October Calendar' },\n    { src: 'Gameday%20Specials.dc.html', label: 'Gameday Specials' },\n    { src: 'Rowdies%20Oct%2024.dc.html', label: 'Rowdies Oct 24' },\n    { src: 'Bulls%20Night.dc.html', label: 'Bulls Night' },\n  ];\n\n  // ── Rotation builder ──────────────────────────────────────────────\n  // Specials + game slides get TWICE the airtime of food slides:\n  // the loop runs special, special, food — repeating.\n  function shuffle(arr) {\n    var a = arr.slice();\n    for (var i = a.length - 1; i > 0; i--) {\n      var j = Math.floor(Math.random() * (i + 1));\n      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;\n    }\n    return a;\n  }\n\n  var SPECIAL_RE = /Clearwater|Taco\\s*Tuesday|Trivia|Happy\\s*Hour|Wing\\s*Thursday|Uncle\\s*Sam|Bucs|Superlyte|Hiring|Free\\s*Pool|Calendar|Gameday|Rowdies|Bulls/i;\n\n  // de-dupe the source list (a slide only needs to be listed once)\n  var seen = {}, unique = [];\n  SLIDES_SRC.forEach(function(s) {\n    if (seen[s.src]) return;\n    seen[s.src] = true;\n    unique.push(s);\n  });\n\n  // ── Featured slide ── shown every FEATURE_EVERY slides, on top of the normal rotation\n  var FEATURE_EVERY = 6;\n  var FEATURED = null;\n  unique = unique.filter(function(s){ if (/Now\\s*Open/i.test(s.label)) { FEATURED = s; return false; } return true; });\n\n  var SPECIALS = shuffle(unique.filter(function(s){ return SPECIAL_RE.test(s.label); }));\n  var FOOD     = shuffle(unique.filter(function(s){ return !SPECIAL_RE.test(s.label); }));\n\n  var SLIDES = [];\n  if (!SPECIALS.length)   { SLIDES = FOOD; }\n  else if (!FOOD.length)  { SLIDES = SPECIALS; }\n  else {\n    // one full pass = every food slide shown once, with 2 specials per food slide\n    var si = 0;\n    for (var fi = 0; fi < FOOD.length; fi++) {\n      SLIDES.push(SPECIALS[si++ % SPECIALS.length]);\n      SLIDES.push(SPECIALS[si++ % SPECIALS.length]);\n      SLIDES.push(FOOD[fi]);\n    }\n  }\n\n  if (FEATURED) {\n    var withFeat = [];\n    for (var k = 0; k < SLIDES.length; k++) {\n      if (k % (FEATURE_EVERY - 1) === 0) withFeat.push(FEATURED);\n      withFeat.push(SLIDES[k]);\n    }\n    SLIDES = withFeat;\n  }\n\n  var stage      = document.getElementById('stage');\n  var hud        = document.getElementById('hud');\n  var hudCount   = document.getElementById('hud-count');\n  var pausedEl   = document.getElementById('paused');\n  var pos        = -1;\n  var curEl      = null;\n  var timer      = null;\n  var paused     = false;\n  var gen        = 0;\n  var preload    = null;   // next slide, built hidden ahead of time\n\n  var fitScale = 1;\n  // TV overscan safe area: most TVs crop ~3-5% of the picture in fullscreen.\n  // SAFE shrinks every slide slightly so nothing on the edges gets cut off.\n  var SAFE = 0.94;\n  function computeFit() { fitScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080) * SAFE; }\n  computeFit();\n  function setTransform(el, extra) {\n    extra = (extra && extra !== 'none') ? extra : '';\n    el._extra = extra;\n    el.style.transform = 'translate(-50%, -50%) scale(' + fitScale + ') ' + extra;\n  }\n  window.addEventListener('resize', function() {\n    computeFit();\n    document.querySelectorAll('.slide').forEach(function(el){ setTransform(el, el._extra); });\n  });\n\n  function makeIframe(src) {\n    var el = document.createElement('iframe');\n    el.className = 'slide';\n    el.setAttribute('scrolling', 'no');\n    el.setAttribute('tabindex', '-1');\n    el.src = src;\n    setTransform(el, '');\n    el.style.opacity = '0';\n    el.style.transition = 'none';\n    return el;\n  }\n\n  // Each transition defines start/end states for the incoming (in*) and outgoing (out*) slide.\n  // Any of transform / opacity / filter / clipPath may be set; unset props stay neutral.\n  var CLEAR = { transform:'none', opacity:'1', filter:'none', clipPath:'none' };\n  // Cheap transitions only — transform + opacity are GPU-composited.\n  // (blur / clip-path animations were removed; they were the main cause of stutter.)\n  var TRANSITIONS = [\n    // Crossfade\n    { name:'fade',\n      inStart:{opacity:'0'}, inEnd:{opacity:'1'},\n      outEnd:{opacity:'0'} },\n    // Push left / right / up\n    { name:'pushLeft',\n      inStart:{transform:'translateX(100%)'}, inEnd:{transform:'none'},\n      outEnd:{transform:'translateX(-45%)', opacity:'0'} },\n    { name:'pushRight',\n      inStart:{transform:'translateX(-100%)'}, inEnd:{transform:'none'},\n      outEnd:{transform:'translateX(45%)', opacity:'0'} },\n    { name:'pushUp',\n      inStart:{transform:'translateY(100%)'}, inEnd:{transform:'none'},\n      outEnd:{transform:'translateY(-45%)', opacity:'0'} },\n    // Gentle zoom fade\n    { name:'zoomIn',\n      inStart:{transform:'scale(1.08)', opacity:'0'}, inEnd:{transform:'none', opacity:'1'},\n      outEnd:{transform:'scale(0.96)', opacity:'0'} }\n  ];\n\n  function applyState(el, state) {\n    setTransform(el, state.transform || '');\n    el.style.opacity   = (state.opacity != null) ? state.opacity : '1';\n    el.style.filter    = state.filter || 'none';\n    el.style.clipPath  = state.clipPath || 'none';\n  }\n\n  // Build a slide iframe hidden, and track when it's fully ready (loaded + inner images).\n  function buildSlide(item) {\n    var el = makeIframe(item.src);\n    el.style.visibility = 'hidden';\n    stage.appendChild(el);\n    el._ready = false;\n    el._cbs = [];\n    var done = false;\n    function markReady() {\n      if (done) return; done = true;\n      el._ready = true;\n      var cbs = el._cbs; el._cbs = [];\n      cbs.forEach(function(cb){ cb(); });\n    }\n    el.addEventListener('load', function() {\n      setTimeout(function() {\n        try {\n          var iDoc = el.contentDocument || (el.contentWindow && el.contentWindow.document);\n          var imgs = iDoc ? Array.prototype.slice.call(iDoc.querySelectorAll('img')) : [];\n          var pending = imgs.filter(function(i){ return !i.complete; });\n          if (!pending.length) { markReady(); return; }\n          var fin = false, cnt = 0;\n          var chk = function(){ cnt++; if (!fin && cnt >= pending.length) { fin = true; markReady(); } };\n          pending.forEach(function(i){ i.addEventListener('load', chk); i.addEventListener('error', chk); });\n          setTimeout(function(){ if (!fin) { fin = true; markReady(); } }, 6000);\n        } catch(e) { markReady(); }\n      }, 400);\n    });\n    setTimeout(markReady, 9000); // hard fallback\n    return el;\n  }\n\n  function whenReady(el, cb) { if (el._ready) cb(); else el._cbs.push(cb); }\n\n  // Preload the slide after the current one so it's rendered before it's shown.\n  function preloadNext() {\n    if (preload && preload.parentNode) preload.remove();\n    var np = (pos + 1) % SLIDES.length;\n    preload = buildSlide(SLIDES[np]);\n    preload._pos = np;\n  }\n\n  // Reveal an already-loaded iframe with a cheap transition.\n  function reveal(el) {\n    var prev = curEl;\n    curEl = el;\n    el.style.visibility = 'visible';\n    var t = TRANSITIONS[Math.floor(Math.random() * TRANSITIONS.length)];\n    var ease = 'cubic-bezier(.62,.02,.24,1)';\n    var trans = 'transform ' + CONFIG.fadeMs + 'ms ' + ease + ', opacity ' + CONFIG.fadeMs + 'ms ease';\n    el.style.zIndex = '2';\n    el.style.transition = 'none';\n    applyState(el, t.inStart || {});\n    void el.offsetWidth;\n    el.style.transition = trans;\n    applyState(el, t.inEnd || CLEAR);\n    if (prev) {\n      prev.style.zIndex = '1';\n      prev.style.transition = trans;\n      applyState(prev, t.outEnd || {opacity:'0'});\n      setTimeout(function(){ if (prev.parentNode) prev.remove(); }, CONFIG.fadeMs + 250);\n    }\n    schedule();\n  }\n\n  // Move to a specific position, reusing the preloaded iframe when it matches.\n  function go(nextPos) {\n    gen++;\n    var myGen = gen;\n    var el;\n    if (preload && preload._pos === nextPos && preload.parentNode) {\n      el = preload; preload = null;\n    } else {\n      if (preload && preload.parentNode) preload.remove();\n      preload = null;\n      el = buildSlide(SLIDES[nextPos]);\n    }\n    pos = nextPos;\n    hudCount.textContent = (pos + 1) + ' / ' + SLIDES.length;\n    whenReady(el, function() {\n      if (myGen !== gen) { if (el.parentNode) el.remove(); return; }\n      reveal(el);\n      preloadNext();\n    });\n  }\n\n  function advance() { go((pos + 1) % SLIDES.length); }\n\n  function schedule() {\n    clearTimeout(timer);\n    if (!paused) timer = setTimeout(advance, CONFIG.holdSec * 1000);\n  }\n\n  function manual(dir) {\n    clearTimeout(timer);\n    go((pos + dir + SLIDES.length) % SLIDES.length);\n  }\n\n  function togglePause() {\n    paused = !paused;\n    pausedEl.classList.toggle('on', paused);\n    if (!paused) schedule(); else clearTimeout(timer);\n  }\n\n  var hudT = null;\n  function poke() {\n    hud.classList.add('on');\n    clearTimeout(hudT);\n    hudT = setTimeout(function() { hud.classList.remove('on'); }, 3500);\n  }\n\n  window.addEventListener('mousemove', poke);\n  poke();\n\n  // Keep keyboard focus on the parent doc so arrow keys always reach this listener\n  // (focus can otherwise land inside a slide iframe and swallow the events).\n  document.body.tabIndex = -1;\n  function reclaimFocus() { if (document.activeElement !== document.body) document.body.focus(); }\n  reclaimFocus();\n  setInterval(reclaimFocus, 500);\n  window.addEventListener('blur', reclaimFocus);\n  window.addEventListener('click', reclaimFocus);\n\n  window.addEventListener('keydown', function(e) {\n    if (e.key === 'ArrowRight') { manual(1); poke(); }\n    else if (e.key === 'ArrowLeft') { manual(-1); poke(); }\n    else if (e.key === 'p' || e.key === 'P') { togglePause(); poke(); }\n    else if (e.key === 'f' || e.key === 'F') {\n      if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }\n      else { document.exitFullscreen && document.exitFullscreen(); }\n    }\n  });\n\n  advance();\n})();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
