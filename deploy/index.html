<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Localz TV Loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #loop { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
</style>
</head>
<body>
<!--
  Stable shell for the TV loop. This page never reloads on its own, so the
  browser stays in fullscreen. The slideshow (loop.html) runs inside the frame
  and refreshes itself when slides change; only the frame reloads.
-->
<iframe id="loop" src="loop.html" allow="fullscreen; autoplay" allowfullscreen></iframe>
<script>
(function () {
  var frame = document.getElementById('loop');

  function toggleFullscreen() {
    var d = document, el = d.documentElement;
    if (!d.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); }
    else if (d.exitFullscreen) { d.exitFullscreen(); }
  }

  // F pressed while the slideshow has focus: it asks this page to go fullscreen.
  window.addEventListener('message', function (e) {
    if (e.data === 'localz-toggle-fullscreen') toggleFullscreen();
  });

  // F pressed while this page has focus. Other keys go on to the slideshow.
  window.addEventListener('keydown', function (e) {
    if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }
    try { frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: e.key })); } catch (_) {}
  });

  // Keep keyboard focus on the slideshow, including after it refreshes itself.
  function focusFrame() { try { frame.contentWindow.focus(); } catch (_) {} }
  frame.addEventListener('load', focusFrame);
  window.addEventListener('click', focusFrame);

  // If the slideshow ever stops responding, reload just the frame (not this page).
  setInterval(function () {
    try { if (!frame.contentDocument || !frame.contentDocument.body) frame.src = 'loop.html?r=' + Date.now(); } catch (_) {}
  }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
