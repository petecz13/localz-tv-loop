<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Philly Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; width: 100%; height: 100%; overflow: hidden; }
  #pf { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px; overflow: hidden;
    background: #0a1a33; font-family: 'Barlow Semi Condensed', sans-serif; color: #fff; transform-origin: center center; }
  @keyframes pf-zoom { 0% { transform: scale(1.0); } 100% { transform: scale(1.06); } }
  .anton { font-family: 'Anton', sans-serif; text-transform: uppercase; font-weight: 400; }
  .bc { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; }
  .deal { display: flex; align-items: center; gap: 22px; }
  .deal .amt { font-family: 'Anton', sans-serif; font-size: 96px; line-height: 1; color: #F2AF32; }
  .deal .amt sup { font-size: 48px; vertical-align: 36px; }
  .deal .nm { font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: 42px; line-height: 1.02; color: #fff; }
</style>
</head>
<body>
<div id="pf">
  <!-- right: full-bleed photo -->
  <div style="position: absolute; top: 0; right: 0; width: 1240px; height: 970px; overflow: hidden;">
    <img src="uploads/philly%20cheesesteak.webp" alt="Philly Cheesesteak" style="width: 100%; height: 100%; object-fit: cover; object-position: center 45%; animation: pf-zoom 12s ease-out forwards;">
  </div>
  <!-- fade photo into navy -->
  <div style="position: absolute; top: 0; left: 0; width: 1260px; height: 970px; background: linear-gradient(90deg, #0a1a33 0%, #0a1a33 64%, rgba(10,26,51,0.85) 76%, rgba(10,26,51,0) 100%);"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 10px; background: #F2AF32;"></div>

  <!-- red Friday badge on the photo -->
  <div style="position: absolute; top: 80px; right: 80px; transform: rotate(5deg); background: linear-gradient(160deg,#d81f2f,#a50e1c); border: 4px solid #F2AF32; border-radius: 16px; padding: 14px 32px; text-align: center; box-shadow: 0 18px 40px rgba(0,0,0,.5);">
    <div class="anton" style="font-size: 64px; line-height: 1;">TGIF</div>
    <div class="bc" style="font-size: 26px; letter-spacing: 5px; color: #ffe2a3;">Friday Only</div>
  </div>

  <!-- left: copy -->
  <div style="position: absolute; top: 96px; left: 96px; width: 900px;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="width: 70px; height: 4px; background: #F2AF32;"></span>
      <span class="bc" style="font-size: 36px; letter-spacing: 10px; color: #9fc3ee;">Every Friday &#8226; All Day</span>
    </div>
    <div class="anton" style="margin-top: 6px; line-height: 0.88;">
      <div style="font-size: 230px; color: #fff; letter-spacing: 3px;">PHILLY</div>
      <div style="font-size: 230px; color: #F2AF32; letter-spacing: 3px; text-shadow: 0 0 34px rgba(242,175,50,0.45), 0 8px 0 #050d1c;">FRIDAY</div>
    </div>

    <!-- hero price -->
    <div style="margin-top: 40px; display: inline-flex; align-items: center; gap: 28px; background: #F2AF32; border-radius: 18px; padding: 10px 40px 14px 30px; box-shadow: 0 16px 36px rgba(0,0,0,0.45);">
      <span class="anton" style="font-size: 150px; line-height: 1; color: #0C2340;"><sup style="font-size: 70px; vertical-align: 56px;">$</sup>10</span>
      <span class="anton" style="font-size: 62px; line-height: 0.98; color: #0C2340;">Philly<br>Cheesesteak</span>
    </div>

    <!-- the other two -->
    <div style="margin-top: 34px; display: flex; gap: 56px;">
      <div class="deal"><span class="amt"><sup>$</sup>12</span><span class="nm">Beach Drive<br>French Dip</span></div>
      <div style="width: 3px; background: rgba(242,175,50,0.5);"></div>
      <div class="deal"><span class="amt"><sup>$</sup>13</span><span class="nm">Double<br>Bacon Philly</span></div>
    </div>
  </div>

  <!-- footer -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; display: flex; align-items: center; gap: 30px; padding: 0 70px; background: #0C2340; border-top: 4px solid #F2AF32;">
    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="height: 92px; width: auto; object-fit: contain;">
    <span class="anton" style="font-size: 40px; letter-spacing: 4px; color: #F2AF32;">Phillyz &#8226; Steakz &#8226; Hoagiez</span>
    <span class="bc" style="margin-left: auto; font-size: 30px; letter-spacing: 5px; color: #9fb6d6;">WWW.LOCALZSPORTSBAR.COM</span>
  </div>
</div>
<script>
  function fit(){ var s=Math.min(innerWidth/1920, innerHeight/1080); document.getElementById('pf').style.transform='scale('+s+')'; }
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
