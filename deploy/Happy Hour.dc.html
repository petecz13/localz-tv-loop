<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #06101f; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  @keyframes hh-bob { 0%,100% { transform: rotate(var(--r)) translateY(0); } 50% { transform: rotate(var(--r)) translateY(-12px); } }
  .hh-food { position: absolute; animation: hh-bob 6s ease-in-out infinite; filter: drop-shadow(0 30px 36px rgba(0,0,0,0.6)); }
</style>
</helmet>

<div id="hh-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(80% 85% at 74% 45%, #173a6e 0%, #0b1f40 55%, #050d1c 100%); font-family: 'Barlow Semi Condensed', sans-serif; transform-origin: center center;">

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(120deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px); pointer-events: none;"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 10px; background: #F2AF32;"></div>
  <div style="position: absolute; top: 140px; left: 960px; width: 960px; height: 800px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,175,50,0.26), transparent);"></div>

  <!-- left: copy -->
  <div style="position: absolute; top: 86px; left: 96px; width: 860px;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="width: 70px; height: 4px; background: #F2AF32;"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 10px; text-transform: uppercase; color: #9fc3ee;">Monday &#8211; Friday</span>
    </div>
    <div style="margin-top: 14px; font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: 0.9;">
      <div style="font-size: 200px; color: #ffffff; letter-spacing: 2px;">HAPPY</div>
      <div style="font-size: 200px; color: #F2AF32; letter-spacing: 2px; text-shadow: 0 0 30px rgba(242,175,50,0.6), 0 8px 0 #071528;">HOUR</div>
    </div>
    <div style="margin-top: 30px; display: inline-flex; align-items: center; padding: 12px 36px; border-radius: 14px; background: #F2AF32; box-shadow: 0 14px 30px rgba(0,0,0,0.4);">
      <span style="font-family: 'Anton', sans-serif; font-size: 66px; letter-spacing: 4px; text-transform: uppercase; color: #0C2340;">3 &#8211; 6 PM</span>
    </div>
    <div style="margin-top: 34px; display: flex; gap: 20px; width: 760px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 18px 10px 20px; border-radius: 16px; background: rgba(12,35,64,0.85); border: 3px solid #F2AF32; box-shadow: 0 14px 28px rgba(0,0,0,0.4);">
        <span style="font-family: 'Anton', sans-serif; font-size: 110px; line-height: 1; color: #F2AF32;">$4</span>
        <span style="margin-top: 4px; font-family: 'Anton', sans-serif; font-size: 46px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff;">Draftz</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 18px 10px 20px; border-radius: 16px; background: rgba(12,35,64,0.85); border: 3px solid #F2AF32; box-shadow: 0 14px 28px rgba(0,0,0,0.4);">
        <span style="font-family: 'Anton', sans-serif; font-size: 110px; line-height: 1; color: #F2AF32;">$5</span>
        <span style="margin-top: 4px; font-family: 'Anton', sans-serif; font-size: 46px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff;">Wellz</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 18px 10px 20px; border-radius: 16px; background: rgba(12,35,64,0.85); border: 3px solid #F2AF32; box-shadow: 0 14px 28px rgba(0,0,0,0.4);">
        <span style="font-family: 'Anton', sans-serif; font-size: 110px; line-height: 1; color: #F2AF32;">$6</span>
        <span style="margin-top: 4px; font-family: 'Anton', sans-serif; font-size: 46px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff;">Winez</span>
      </div>
    </div>
  </div>

  <!-- right: half price apps -->
  <img src="uploads/hh-skins.webp" alt="Crispy Potato Skins" class="hh-food" style="left: 975px; top: 450px; width: 370px; --r: -9deg; animation-duration: 6.5s;">
  <img src="uploads/hh-pretzels.webp" alt="Pretzel Bites" class="hh-food" style="left: 1515px; top: 450px; width: 370px; --r: 8deg; animation-duration: 5.5s;">
  <img src="uploads/hh-quesadilla.webp" alt="Chicken Quesadilla" class="hh-food" style="left: 1235px; top: 405px; width: 390px; --r: -2deg; animation-duration: 7s;">

  <div style="position: absolute; left: 1080px; top: 96px; width: 720px; display: flex; flex-direction: column; align-items: center; padding: 22px 30px 26px; border-radius: 20px; background: linear-gradient(100deg, #d62828 0%, #b81d1d 100%); border: 4px solid #F2AF32; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: rotate(-3deg);">
    <div style="display: flex; align-items: baseline; gap: 18px; line-height: 1;">
      <span style="font-family: 'Anton', sans-serif; font-size: 130px; color: #F2AF32;">&#189;</span>
      <span style="font-family: 'Anton', sans-serif; font-size: 110px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff;">Price</span>
    </div>
    <span style="font-family: 'Anton', sans-serif; font-size: 56px; letter-spacing: 6px; text-transform: uppercase; color: #ffffff;">Appetizerz</span>
  </div>

  <!-- footer -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; display: flex; align-items: center; gap: 30px; padding: 0 70px; background: #0C2340; border-top: 4px solid #F2AF32;">
    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="height: 92px; width: auto; object-fit: contain;">
    <span style="font-family: 'Anton', sans-serif; font-size: 40px; letter-spacing: 4px; text-transform: uppercase; color: #F2AF32;">Draftz &#8226; Wellz &#8226; Winez &#8226; Appz</span>
    <span style="margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 5px; text-transform: uppercase; color: #9fb6d6;">WWW.LOCALZSPORTSBAR.COM</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('hh-stage');
      if (!el) { requestAnimationFrame(fit); return; }
      const w = window.innerWidth || document.documentElement.clientWidth;
      const h = window.innerHeight || document.documentElement.clientHeight;
      const s = Math.min(w / 1920, h / 1080);
      if (!s || !isFinite(s)) { requestAnimationFrame(fit); return; }
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
