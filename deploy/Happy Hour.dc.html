<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #04060e; }
  @keyframes hh-eyeglow { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a1526; border: 30px solid #e0b23c; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.35); font-family: 'Barlow Semi Condensed', sans-serif;">

  <!-- ============ HEADER BAR ============ -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 210px; background: linear-gradient(180deg, #16263f 0%, #0f1c31 100%); border-bottom: 6px solid #e0b23c; display: flex; align-items: center; padding: 0 64px; box-shadow: 0 6px 24px rgba(0,0,0,0.5);">
    <!-- US flag chip -->
    <div style="width: 200px; height: 128px; border-radius: 12px; overflow: hidden; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 6px 16px rgba(0,0,0,0.5); flex: 0 0 auto;">
      <img src="uploads/us-flag.webp" alt="USA" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <!-- Localz logo -->
    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar & Grill" style="height: 168px; width: auto; object-fit: contain; margin-left: 40px; flex: 0 0 auto;">
    <!-- HAPPY HOUR title -->
    <h1 style="margin-left: auto; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 150px; line-height: 1; letter-spacing: 2px; text-transform: uppercase; display: flex; gap: 34px;">
      <span style="color: #f4ecd8;">HAPPY</span>
      <span style="color: #e0b23c;">HOUR</span>
    </h1>
  </div>

  <!-- ============ BODY PANEL (flag background) ============ -->
  <div style="position: absolute; top: 210px; left: 0; right: 0; bottom: 0; overflow: hidden;">
    <!-- flag backdrop -->
    <img src="uploads/us-flag.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.16;">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(9,17,32,0.82) 0%, rgba(9,17,32,0.9) 100%);"></div>

    <!-- inner content frame -->
    <div style="position: absolute; inset: 40px 56px 44px 56px; border-radius: 20px; border: 2px solid rgba(224,178,60,0.55); box-shadow: inset 0 0 30px rgba(0,0,0,0.4), 0 0 24px rgba(224,178,60,0.15); display: flex; flex-direction: column; padding: 34px 60px 0 60px;">

      <!-- time / days eyebrow -->
      <div style="display: flex; align-items: center; justify-content: center; gap: 26px;">
        <span style="height: 2px; width: 120px; background: linear-gradient(90deg, transparent, rgba(224,178,60,0.9));"></span>
        <span style="font-family: 'Anton', sans-serif; font-size: 58px; letter-spacing: 4px; text-transform: uppercase; color: #ffd45c; white-space: nowrap; text-shadow: 0 0 12px rgba(240,176,40,0.65); animation: hh-eyeglow 4s ease-in-out infinite;">3–6 PM &nbsp;·&nbsp; Mon–Fri</span>
        <span style="height: 2px; width: 120px; background: linear-gradient(270deg, transparent, rgba(224,178,60,0.9));"></span>
      </div>

      <!-- two columns: 3 drink boxes left, apps box right -->
      <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 28px 0 6px 0;">

        <!-- left: 3 stacked drink boxes -->
        <div style="display: flex; flex-direction: column; gap: 26px;">
          <sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
            <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 34px; border-radius: 18px; border: 2px solid rgba(224,178,60,0.55); background: linear-gradient(135deg, rgba(6,12,24,0.72), rgba(14,26,46,0.58)); box-shadow: inset 0 0 20px rgba(0,0,0,0.45), 0 0 18px rgba(224,178,60,0.12);">
              <span style="font-family: 'Anton', sans-serif; font-size: 116px; line-height: 1; color: #ffd45c; text-shadow: 0 0 14px rgba(240,176,40,0.55);">{{ row.price }}</span>
              <span style="font-family: 'Anton', sans-serif; font-size: 92px; line-height: 1; letter-spacing: 3px; text-transform: uppercase; color: #f4ecd8;">{{ row.label }}</span>
            </div>
          </sc-for>
        </div>

        <!-- right: tall half-price apps box -->
        <div style="position: relative; border-radius: 18px; overflow: hidden; border: 3px solid #e0b23c; background: linear-gradient(135deg, #7c1420, #a81b2b 55%, #7c1420); box-shadow: inset 0 0 24px rgba(0,0,0,0.4), 0 0 20px rgba(224,178,60,0.28);">
          <div style="position: absolute; inset: 0; background: radial-gradient(70% 130% at 50% 50%, rgba(255,120,120,0.24), transparent 72%);"></div>
          <!-- vertical stack: photo, text, photo -->
          <div style="position: absolute; inset: 22px; display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <div style="flex: 1; width: 100%; border-radius: 14px; overflow: hidden; border: 3px solid #e0b23c; box-shadow: 0 5px 14px rgba(0,0,0,0.5);">
              <img src="uploads/quesadilla-tray.webp" alt="South Philly Quesadilla" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%;">
            </div>
            <div style="flex: 0 0 auto; text-align: center;">
              <div style="font-family: 'Anton', sans-serif; font-size: 88px; line-height: 0.9; letter-spacing: 1px; text-transform: uppercase; color: #ffd45c; text-shadow: 0 0 14px rgba(240,176,40,0.6);">½ Price</div>
              <div style="font-family: 'Anton', sans-serif; font-size: 66px; line-height: 0.98; letter-spacing: 1px; text-transform: uppercase; color: #ffffff; text-shadow: 0 3px 0 rgba(0,0,0,0.35);">Appetizerz</div>
            </div>
            <div style="flex: 1; width: 100%; border-radius: 14px; overflow: hidden; border: 3px solid #e0b23c; box-shadow: 0 5px 14px rgba(0,0,0,0.5);">
              <img src="uploads/crispy-potato-skins.webp" alt="Crispy Potato Skins" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%;">
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1920, &quot;height&quot;: 1080 }
}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    return {
      rows: p.rows ?? [
        { price: "$4", label: "Draftz" },
        { price: "$5", label: "Wellz" },
        { price: "$6", label: "Winez" }
      ]
    };
  }
}
</script>
</body>
</html>
