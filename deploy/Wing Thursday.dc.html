<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #06101f; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  @keyframes wt-spin { 0%,100% { transform: rotate(var(--r)); } 50% { transform: rotate(calc(var(--r) + 6deg)); } }
  .wt-plate { animation: wt-spin 7s ease-in-out infinite; }
  @keyframes wt-heat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .wt-tallow { animation: wt-heat 2.4s ease-in-out infinite; transform-origin: left center; }
</style>
</helmet>

<div id="wt-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(80% 85% at 72% 45%, #173a6e 0%, #0b1f40 55%, #050d1c 100%); font-family: 'Barlow Semi Condensed', sans-serif; transform-origin: center center;">

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(120deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px); pointer-events: none;"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 10px; background: #F2AF32;"></div>
  <div style="position: absolute; top: 80px; left: 940px; width: 980px; height: 860px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,120,30,0.30), transparent);"></div>

  <!-- left: copy -->
  <div style="position: absolute; top: 86px; left: 96px; width: 860px;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="width: 70px; height: 4px; background: #F2AF32;"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 10px; text-transform: uppercase; color: #9fc3ee;">Every Thursday</span>
    </div>
    <div style="margin-top: 14px; font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: 0.9;">
      <div style="font-size: 200px; color: #ffffff; letter-spacing: 2px;">WING</div>
      <div style="font-size: 180px; color: #F2AF32; letter-spacing: 2px; text-shadow: 0 0 30px rgba(242,175,50,0.6), 0 8px 0 #071528;">THURSDAY</div>
    </div>

    <div style="margin-top: 36px; display: flex; align-items: center; gap: 26px;">
      <div style="padding: 8px 34px 14px; border-radius: 16px; background: #F2AF32; box-shadow: 0 14px 30px rgba(0,0,0,0.4);">
        <span style="font-family: 'Anton', sans-serif; font-size: 130px; line-height: 1; color: #0C2340;">$1</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Anton', sans-serif; font-size: 66px; line-height: 1; letter-spacing: 2px; text-transform: uppercase; color: #ffffff;">Per Wing</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: 2px; text-transform: uppercase; color: #9fc3ee;">$9 Half Pound &#8226; <span style="color: #F2AF32;">9 Wings Per Order</span></span>
      </div>
    </div>

    <div class="wt-tallow" style="margin-top: 36px; display: inline-flex; padding-right: 54px; align-items: center; gap: 26px; padding: 22px 36px; border-radius: 18px; background: linear-gradient(100deg, #d62828 0%, #f07a1a 60%, #ffb02e 100%); border: 4px solid #ffd166; box-shadow: 0 0 40px rgba(240,122,26,0.65), 0 18px 34px rgba(0,0,0,0.45);">
      <svg width="70" height="92" viewBox="0 0 70 92" style="flex: none; filter: drop-shadow(0 0 12px rgba(255,200,80,0.9));">
        <path d="M35 2 C40 22 62 32 62 58 C62 77 50 90 35 90 C20 90 8 77 8 58 C8 44 16 36 22 30 C22 42 28 48 32 48 C28 34 30 16 35 2 Z" fill="#ffd166"/>
        <path d="M35 40 C38 52 50 58 50 70 C50 81 43 88 35 88 C27 88 20 81 20 71 C20 63 25 58 28 55 C29 62 32 65 35 65 C33 57 33 48 35 40 Z" fill="#fff4d6"/>
      </svg>
      <div style="display: flex; flex-direction: column; line-height: 1;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 8px; text-transform: uppercase; color: #fff4d6;">Fried in</span>
        <span style="font-family: 'Anton', sans-serif; font-size: 96px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff; text-shadow: 0 5px 0 rgba(90,10,0,0.55);">Beef Tallow</span>
      </div>
    </div>
  </div>

  <!-- Thursday Night Football -->
  <div style="position: absolute; left: 838px; top: 120px; width: 300px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <img src="uploads/tnf-logo.webp" alt="Thursday Night Football" style="width: 230px; height: auto; filter: drop-shadow(0 18px 26px rgba(0,0,0,0.6));">
    <span style="padding: 8px 20px; border-radius: 999px; background: #0C2340; border: 3px solid #F2AF32; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff; white-space: nowrap;">Watch It Here</span>
  </div>

  <!-- right: wing plates -->
  <div style="position: absolute; left: 1190px; top: 110px; width: 500px; display: flex; flex-direction: column; align-items: center;">
    <img src="uploads/wt-dryrub.webp" alt="Localz Dry Rub" class="wt-plate" style="width: 500px; height: 500px; border-radius: 50%; box-shadow: 0 0 0 8px #F2AF32, 0 30px 50px rgba(0,0,0,0.6); --r: -4deg; animation-duration: 7s;">
    <div style="margin-top: -34px; position: relative; padding: 10px 24px; border-radius: 999px; background: #0C2340; border: 3px solid #F2AF32; box-shadow: 0 10px 20px rgba(0,0,0,0.45);">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; white-space: nowrap;">Localz Dry Rub</span>
    </div>
  </div>
  <div style="position: absolute; left: 985px; top: 560px; width: 340px; display: flex; flex-direction: column; align-items: center;">
    <img src="uploads/wt-bgp.webp" alt="Buffalo Garlic Parm" class="wt-plate" style="width: 340px; height: 340px; border-radius: 50%; box-shadow: 0 0 0 6px #F2AF32, 0 30px 50px rgba(0,0,0,0.6); --r: 6deg; animation-duration: 8s;">
    <div style="margin-top: -34px; position: relative; padding: 10px 24px; border-radius: 999px; background: #0C2340; border: 3px solid #F2AF32; box-shadow: 0 10px 20px rgba(0,0,0,0.45);">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; white-space: nowrap;">Buffalo Garlic Parm</span>
    </div>
  </div>
  <div style="position: absolute; left: 1530px; top: 560px; width: 340px; display: flex; flex-direction: column; align-items: center;">
    <img src="uploads/wt-peach.webp" alt="Peach Mango Habanero" class="wt-plate" style="width: 340px; height: 340px; border-radius: 50%; box-shadow: 0 0 0 6px #F2AF32, 0 30px 50px rgba(0,0,0,0.6); --r: -8deg; animation-duration: 6.5s;">
    <div style="margin-top: -34px; position: relative; padding: 10px 24px; border-radius: 999px; background: #0C2340; border: 3px solid #F2AF32; box-shadow: 0 10px 20px rgba(0,0,0,0.45);">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; white-space: nowrap;">Peach Mango Habanero</span>
    </div>
  </div>

  <!-- footer -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; display: flex; align-items: center; gap: 30px; padding: 0 70px; background: #0C2340; border-top: 4px solid #F2AF32;">
    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="height: 92px; width: auto; object-fit: contain;">
    <span style="font-family: 'Anton', sans-serif; font-size: 40px; letter-spacing: 4px; text-transform: uppercase; color: #F2AF32;">Wings &#8226; Beer &#8226; Thursday Night</span>
    <span style="margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 5px; text-transform: uppercase; color: #9fb6d6;">WWW.LOCALZSPORTSBAR.COM</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('wt-stage');
      if (!el) { requestAnimationFrame(fit); return; }
      const w = window.innerWidth || document.documentElement.clientWidth;
      const h = window.innerHeight || document.documentElement.clientHeight;
      const s = Math.min(w / 1920, h / 1080);
      if (!s || !isFinite(s)) { requestAnimationFrame(fit); return; }
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
