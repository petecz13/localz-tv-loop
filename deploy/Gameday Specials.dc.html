<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gameday Specials</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #10233f; width: 100%; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<div id="stage" style="position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px; overflow: hidden; background: #10233f; transform-origin: center center;">
  <img src="uploads/gameday-specials.webp" alt="" style="position: absolute; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; filter: blur(40px) brightness(0.45);">
  <img src="uploads/gameday-specials.webp" alt="Gameday Specials" style="position: absolute; left: 420px; top: 0; width: 1080px; height: 1080px; box-shadow: 0 0 80px rgba(0,0,0,0.6);">
</div>
<script>
  function fit(){ var s=Math.min(innerWidth/1920, innerHeight/1080); document.getElementById('stage').style.transform='scale('+s+')'; }
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
