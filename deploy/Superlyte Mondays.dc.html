<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #060a14; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  a { color: #ffd166; }
  a:hover { color: #ffe08a; }
  @keyframes sl-drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-24px); } }
  @keyframes sl-drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-26px,22px); } }
  @keyframes sl-pop { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.04) rotate(-4deg); } }
  @keyframes sl-shine { 0% { transform: translateX(-130%) skewX(-16deg); } 55%,100% { transform: translateX(320%) skewX(-16deg); } }
</style>
</helmet>

<div id="sl-stage" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(120% 100% at 50% 0%, #10182c 0%, #060a14 60%); font-family: 'Barlow Semi Condensed', sans-serif; transform-origin: center center;">

  <!-- color blobs echoing can flavors -->
  <div style="position: absolute; top: -160px; left: -120px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(255,140,40,0.45), transparent 70%); filter: blur(10px); animation: sl-drift1 9s ease-in-out infinite;"></div>
  <div style="position: absolute; bottom: -180px; left: 18%; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(255,70,120,0.4), transparent 70%); filter: blur(10px); animation: sl-drift2 10s ease-in-out infinite;"></div>
  <div style="position: absolute; top: 10%; right: -140px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(90,220,90,0.38), transparent 70%); filter: blur(10px); animation: sl-drift1 11s ease-in-out infinite;"></div>
  <div style="position: absolute; bottom: -140px; right: 6%; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(40,170,255,0.4), transparent 70%); filter: blur(10px); animation: sl-drift2 8.5s ease-in-out infinite;"></div>

  <!-- diagonal texture -->
  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(120deg, transparent 0 22px, rgba(255,255,255,0.03) 22px 24px); pointer-events: none;"></div>

  <!-- ===== HEADER ===== -->
  <div style="position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 24px; padding-top: 54px;">
    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="position: absolute; left: 60px; top: 44px; height: 84px; width: auto; object-fit: contain; filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55));">
    <span style="height: 2px; width: 90px; background: linear-gradient(90deg, transparent, #ffd166); box-shadow: 0 0 8px rgba(255,209,102,0.7);"></span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 38px; letter-spacing: 8px; text-transform: uppercase; color: #ffe08a; white-space: nowrap;">DRINK SPECIAL</span>
    <span style="height: 2px; width: 90px; background: linear-gradient(270deg, transparent, #ffd166); box-shadow: 0 0 8px rgba(255,209,102,0.7);"></span>
  </div>

  <!-- ===== MAIN ===== -->
  <div style="position: relative; z-index: 2; flex: 1; height: 780px; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;">

    <!-- text column -->
    <div style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; max-width: 900px;">
      <h1 style="font-family: 'Anton', sans-serif; font-weight: 400; line-height: 0.86; text-transform: uppercase;">
        <span style="display: block; font-size: 100px; color: #f6efdd; text-shadow: 0 3px 0 rgba(0,0,0,0.4);">SUPER LYTE</span>
        <span style="display: block; font-size: 132px; background: linear-gradient(92deg, #ff8c28, #ff4678 34%, #5adc5a 68%, #28aaff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 4px 0 rgba(0,0,0,0.25);">MONDAYS</span>
      </h1>

      <div style="margin-top: 40px; display: flex; align-items: center; gap: 28px;">
        <div style="position: relative; overflow: hidden; display: flex; align-items: baseline; gap: 10px; padding: 18px 40px; border-radius: 18px; background: linear-gradient(135deg, #ff4678, #ff8c28); box-shadow: 0 0 30px rgba(255,100,100,0.4), 0 16px 32px rgba(0,0,0,0.5); transform: rotate(-4deg); animation: sl-pop 3.4s ease-in-out infinite;">
          <span style="position: absolute; top: 0; bottom: 0; width: 60px; background: rgba(255,255,255,0.35); animation: sl-shine 3.4s ease-in-out infinite;"></span>
          <span style="font-family: 'Anton', sans-serif; font-size: 96px; color: #fff; line-height: 1;">$5</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 2px; color: #fff2e0; text-transform: uppercase;">Cans</span>
        </div>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 1px; color: #cfe0f2;">All Day, Every Monday</span>
      </div>

      <p style="margin-top: 34px; max-width: 760px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 500; font-size: 32px; line-height: 1.35; color: #b9c6da; text-wrap: pretty;">Vodka + Ade, zero sugar. Orange, Fruit Punch, Lemon Lime &amp; Blue Chill — grab your flavor and start the week right.</p>

      <div style="margin-top: 36px; display: flex; gap: 14px;">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #ff8c28; box-shadow: 0 0 12px rgba(255,140,40,0.7);"></span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #ff5f8a; box-shadow: 0 0 12px rgba(255,95,138,0.7);"></span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #7fe05a; box-shadow: 0 0 12px rgba(127,224,90,0.7);"></span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #3fb4ff; box-shadow: 0 0 12px rgba(63,180,255,0.7);"></span>
      </div>
    </div>

    <!-- can lineup image -->
    <div style="flex-shrink: 0; width: 760px; height: 700px; display: flex; align-items: center; justify-content: center;">
      <img src="uploads/SuperLyte-Lineup-Wide.webp" alt="Super Lyte can lineup" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 30px 50px rgba(0,0,0,0.6));">
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div style="position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 18px; padding-bottom: 46px;">
    <span style="height: 2px; width: 300px; background: linear-gradient(90deg, transparent, rgba(255,209,102,0.4));"></span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 5px; text-transform: uppercase; color: #cfe0f2;">WWW.LOCALZSPORTSBAR.COM</span>
    <span style="height: 2px; width: 300px; background: linear-gradient(270deg, transparent, rgba(255,209,102,0.4));"></span>
  </div>
</div>
</helmet>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('sl-stage');
      if (!el) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
