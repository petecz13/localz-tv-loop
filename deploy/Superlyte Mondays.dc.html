<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes sl-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
</style>
</helmet>

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(120deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 24px); pointer-events: none;"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 10px; background: #F2AF32;"></div>
  <!-- static flavor-colored glows behind the cans -->
  <div style="position: absolute; top: 160px; left: 980px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(closest-side, rgba(247,148,29,0.35), transparent);"></div>
  <div style="position: absolute; top: 120px; left: 1260px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(closest-side, rgba(239,79,107,0.32), transparent);"></div>
  <div style="position: absolute; top: 420px; left: 1100px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(closest-side, rgba(181,211,52,0.25), transparent);"></div>
  <div style="position: absolute; top: 400px; left: 1420px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(closest-side, rgba(90,180,229,0.32), transparent);"></div>

  <!-- left: copy -->
  <div style="position: absolute; top: 86px; left: 96px; width: 860px;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="width: 70px; height: 4px; background: #F2AF32;"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 10px; text-transform: uppercase; color: #9fc3ee;">Drink Special</span>
    </div>
    <div style="margin-top: 14px; font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: 0.9;">
      <div style="font-size: 170px; color: #ffffff; letter-spacing: 2px;">SUPER LYTE</div>
      <div style="font-size: 190px; color: #F2AF32; letter-spacing: 2px; text-shadow: 0 0 30px rgba(242,175,50,0.6), 0 8px 0 #071528;">MONDAYS</div>
    </div>

    <div style="margin-top: 34px; display: flex; align-items: center; gap: 26px;">
      <div style="padding: 8px 34px 14px; border-radius: 16px; background: #F2AF32; box-shadow: 0 14px 30px rgba(0,0,0,0.4);">
        <span style="font-family: 'Anton', sans-serif; font-size: 130px; line-height: 1; color: #0C2340;">$5</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Anton', sans-serif; font-size: 72px; line-height: 1; letter-spacing: 2px; text-transform: uppercase; color: #ffffff;">Cans</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: 2px; text-transform: uppercase; color: #9fc3ee;">All Day &#8226; <span style="color: #F2AF32;">Every Monday</span></span>
      </div>
    </div>

    <div style="margin-top: 30px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff;">Vodka + Ade &#8226; <span style="color: #F2AF32;">Zero Sugar</span></div>
    <div style="margin-top: 18px; display: flex; flex-wrap: nowrap; gap: 10px; width: 880px;"><div style="display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: rgba(12,35,64,0.85); border: 2px solid #f7941d;"><span style="width: 18px; height: 18px; border-radius: 50%; background: #f7941d;"></span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 1px; text-transform: uppercase; color: #ffffff;">Orange</span></div><div style="display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: rgba(12,35,64,0.85); border: 2px solid #ef4f6b;"><span style="width: 18px; height: 18px; border-radius: 50%; background: #ef4f6b;"></span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 1px; text-transform: uppercase; color: #ffffff;">Fruit Punch</span></div><div style="display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: rgba(12,35,64,0.85); border: 2px solid #b5d334;"><span style="width: 18px; height: 18px; border-radius: 50%; background: #b5d334;"></span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 1px; text-transform: uppercase; color: #ffffff;">Lemon Lime</span></div><div style="display: flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: rgba(12,35,64,0.85); border: 2px solid #5ab4e5;"><span style="width: 18px; height: 18px; border-radius: 50%; background: #5ab4e5;"></span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 1px; text-transform: uppercase; color: #ffffff;">Blue Chill</span></div></div>
  </div>

  <!-- right: cans -->
  <img src="uploads/sl-cans.webp" alt="Super Lyte cans" style="position: absolute; left: 1010px; top: 150px; width: 840px; height: auto; filter: drop-shadow(0 36px 40px rgba(0,0,0,0.6)); animation: sl-bob 6s ease-in-out infinite;">

  <!-- footer -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; display: flex; align-items: center; gap: 30px; padding: 0 70px; background: #0C2340; border-top: 4px solid #F2AF32;">
    <img src="uploads/St.peteLogo.webp" alt="Localz Sports Bar &amp; Grill" style="height: 92px; width: auto; object-fit: contain;">
    <span style="font-family: 'Anton', sans-serif; font-size: 40px; letter-spacing: 4px; text-transform: uppercase; color: #F2AF32;">Grab Your Flavor &#8226; Start the Week Right</span>
    <span style="margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 5px; text-transform: uppercase; color: #9fb6d6;">WWW.LOCALZSPORTSBAR.COM</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  componentDidMount() {
    const fit = () => {
      const el = document.getElementById('sl-stage');
      if (!el) { requestAnimationFrame(fit); return; }
      const w = window.innerWidth || document.documentElement.clientWidth;
      const h = window.innerHeight || document.documentElement.clientHeight;
      const s = Math.min(w / 1920, h / 1080);
      if (!s || !isFinite(s)) { requestAnimationFrame(fit); return; }
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
